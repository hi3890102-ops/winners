name: Auth Flow Check

on:
  push:
    branches: [security-v2]
    paths:
      - '.github/workflows/auth-flow-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify signup and login flow
        shell: bash
        run: |
          set -euo pipefail
          APIKEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' index.html | head -1)
          BASE='https://bhwuuxcrzxespkjlmqxr.supabase.co'
          USERNAME="testgh${GITHUB_RUN_ID}"
          PASSWORD="$(openssl rand -hex 10)Aa9"

          SIGNUP=$(curl -sS -X POST "$BASE/functions/v1/manee-signup" \
            -H "apikey: $APIKEY" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}")

          test "$(echo "$SIGNUP" | jq -r '.ok // false')" = 'true'
          USER_ID=$(echo "$SIGNUP" | jq -r '.user_id')
          echo "signup_ok=true"
          echo "signup_user_id=$USER_ID"

          LOGIN=$(curl -sS -X POST "$BASE/functions/v1/manee-login" \
            -H "apikey: $APIKEY" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}")

          test "$(echo "$LOGIN" | jq -r '.ok // false')" = 'true'
          TOKEN=$(echo "$LOGIN" | jq -r '.session.access_token')
          test -n "$TOKEN"
          echo 'login_session=true'

          PROFILE=$(curl -sS "$BASE/rest/v1/profiles?select=user_id,username" \
            -H "apikey: $APIKEY" \
            -H "Authorization: Bearer $TOKEN")
          SELF_ONLY=$(echo "$PROFILE" | jq -r --arg uid "$USER_ID" 'length == 1 and .[0].user_id == $uid')
          test "$SELF_ONLY" = 'true'
          echo 'profile_self_only=true'

          ADMINS=$(curl -sS "$BASE/rest/v1/platform_admins?select=user_id" \
            -H "apikey: $APIKEY" \
            -H "Authorization: Bearer $TOKEN")
          FRANCHISE=$(curl -sS "$BASE/rest/v1/franchise_memberships?select=id" \
            -H "apikey: $APIKEY" \
            -H "Authorization: Bearer $TOKEN")
          STORES=$(curl -sS "$BASE/rest/v1/store_memberships?select=id" \
            -H "apikey: $APIKEY" \
            -H "Authorization: Bearer $TOKEN")

          test "$(echo "$ADMINS" | jq 'length')" -eq 0
          test "$(echo "$FRANCHISE" | jq 'length')" -eq 0
          test "$(echo "$STORES" | jq 'length')" -eq 0
          echo 'no_privileged_memberships=true'

          STATUS=$(curl -sS -o /tmp/escalate.json -w '%{http_code}' -X POST "$BASE/rest/v1/platform_admins" \
            -H "apikey: $APIKEY" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -H 'Prefer: return=representation' \
            -d "{\"user_id\":\"$USER_ID\",\"role\":\"super_admin\",\"status\":\"active\"}")
          test "$STATUS" -ge 400
          echo 'privilege_escalation_blocked=true'
