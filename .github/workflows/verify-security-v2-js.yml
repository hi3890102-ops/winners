name: Verify Security V2 JS

on:
  push:
    branches: [security-v2]
    paths:
      - '.github/workflows/verify-security-v2-js.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v2
      - name: Extract and syntax-check inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks, 'inline script not found'
          js=max(blocks,key=len)
          Path('/tmp/manee-app.js').write_text(js,encoding='utf-8')
          assert 'manee-signup' in js
          assert 'manee-login' in js
          assert 'db.auth.getSession()' in js
          print('auth_wiring_present=true')
          PY
          node --check /tmp/manee-app.js
          echo 'javascript_syntax=true'
