name: Auth Settings Check

on:
  push:
    branches: [security-v2]
    paths:
      - '.github/workflows/auth-settings-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public Supabase Auth settings
        shell: bash
        run: |
          set -euo pipefail
          APIKEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' index.html | head -1)
          RESP=$(curl -sS 'https://bhwuuxcrzxespkjlmqxr.supabase.co/auth/v1/settings' -H "apikey: $APIKEY")
          echo "$RESP" | jq -c '{disable_signup, external, mailer_autoconfirm, password_min_length, password_required_characters}'
