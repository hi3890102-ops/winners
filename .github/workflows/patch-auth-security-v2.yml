name: Patch Auth Security V2

on:
  push:
    branches: [security-v2]
    paths:
      - '.github/workflows/patch-auth-security-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v2
      - name: Patch user app auth flow
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_q = "let q = db.from('stores').select('id,name,lat,lng,onboarding_done,manager_dashboard_enabled,business_day_cutoff_hour').order('created_at');"
          new_q = "let q = db.from('stores').select('id,name,lat,lng,onboarding_done,manager_dashboard_enabled,business_day_cutoff_hour').is('archived_at', null).order('created_at');"
          assert old_q in s
          s = s.replace(old_q, new_q, 1)

          marker = '''  function startStoreOwnerFlow(){
    state.landingMode = "store-entry";
    render();
  }'''
          helpers = '''  async function callManeeAuthApi(slug, payload){
    const res = await fetch(SUPABASE_URL+"/functions/v1/"+slug, {
      method: "POST",
      headers: { "Content-Type":"application/json", "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify(payload||{})
    });
    let data = null;
    try{ data = await res.json(); }catch(e){ data = null; }
    if(!res.ok || !data || data.ok !== true){
      const err = new Error((data && data.message) || "처리 중 오류가 발생했어요.");
      err.code = data && data.error;
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function applyManeeAuthSession(session){
    if(!session || !session.access_token || !session.refresh_token) throw new Error("로그인 세션을 만들지 못했어요.");
    const { error } = await db.auth.setSession({ access_token:session.access_token, refresh_token:session.refresh_token });
    if(error) throw error;
  }

  async function enterAuthenticatedOwner(username, preferredStore){
    await loadStoreList(username);
    if(!state.storeList.length) throw new Error("연결된 매장을 찾지 못했어요.");
    state.myUsername = username;
    state.myStores = [...state.storeList];
    state.myRequestId = null;
    localDelete("my-request-id");
    const target = preferredStore && state.storeList.includes(preferredStore) ? preferredStore : state.storeList[0];
    await becomeStoreOwner(target);
  }

''' + marker
          assert marker in s
          s = s.replace(marker, helpers, 1)

          auth_restore_marker = '''    }catch(e){}
    try{
      const reqIdR = localGet("my-request-id");'''
          auth_restore = '''    }catch(e){}
    try{
      const { data: authData } = await db.auth.getSession();
      const session = authData && authData.session;
      if(session && session.user){
        const { data: profile, error: profileError } = await db.from('profiles').select('user_id,username,status').eq('user_id', session.user.id).maybeSingle();
        if(!profileError && profile && profile.status === 'active'){
          const { data: memberships } = await db.from('store_memberships').select('store_id,role,status').eq('user_id', session.user.id).eq('status','active');
          const ownerMembership = (memberships||[]).find(m=>m.role === 'owner');
          if(ownerMembership){
            await loadStoreList(profile.username);
            if(state.storeList.length){
              state.role = "storeOwner";
              state.store = state.storeList[0];
              state.myUsername = profile.username;
              state.myStores = [...state.storeList];
              state.myRequestId = null;
              await loadAllForStore(state.store);
              state.onboardingStep = (state.storeOnboardingMap && !state.storeOnboardingMap[state.store]) ? "location" : null;
              render();
              return;
            }
          }
        }
      }
    }catch(e){}
    try{
      const reqIdR = localGet("my-request-id");'''
          assert auth_restore_marker in s
          s = s.replace(auth_restore_marker, auth_restore, 1)

          pattern = re.compile(r'''  async function submitOwnerRequest\(\)\{.*?\n  \}\n\n  async function loginStoreOwner\(\)\{.*?\n  \}\n\n  async function submitPasswordResetRequest\(\)\{''', re.S)
          replacement = '''  async function submitOwnerRequest(){
    const nameInput = document.getElementById("owner-request-name-input");
    const storeInput = document.getElementById("owner-request-store-input");
    const userInput = document.getElementById("owner-request-username-input");
    const pwInput = document.getElementById("owner-request-password-input");
    const pwConfirmInput = document.getElementById("owner-request-password-confirm-input");
    const name = (nameInput.value||"").trim();
    const storeName = (storeInput.value||"").trim();
    const username = (userInput.value||"").trim();
    const pw = pwInput.value||"";
    const pwConfirm = pwConfirmInput.value||"";
    if(!name || !storeName || !username){ showToast("이름, 매장명, 아이디를 모두 입력해 주세요."); return; }
    if(pw.length < 8){ showToast("비밀번호는 8자 이상으로 만들어 주세요."); return; }
    if(pw !== pwConfirm){ showToast("비밀번호가 서로 달라요."); return; }
    showToast("계정을 만드는 중이에요…");
    try{
      const data = await callManeeAuthApi("manee-signup", { username, password:pw, display_name:name, store_name:storeName });
      let session = data.session;
      if(!session){
        const loginData = await callManeeAuthApi("manee-login", { username, password:pw });
        session = loginData.session;
      }
      await applyManeeAuthSession(session);
      await enterAuthenticatedOwner(data.user.username, data.store.name);
      showToast("가입이 완료됐어요");
    }catch(e){
      showToast((e && e.message) ? e.message : "가입에 실패했어요.");
    }
  }

  async function loginStoreOwner(){
    const userInput = document.getElementById("store-login-username-input");
    const pwInput = document.getElementById("store-login-password-input");
    const username = (userInput.value||"").trim();
    const pw = pwInput.value||"";
    if(!username || !pw){ showToast("아이디와 비밀번호를 입력해 주세요."); return; }
    showToast("확인 중이에요…");

    let authError = null;
    try{
      const authData = await callManeeAuthApi("manee-login", { username, password:pw });
      await applyManeeAuthSession(authData.session);
      await enterAuthenticatedOwner(authData.user.username, null);
      return;
    }catch(e){ authError = e; }

    // 기존 승인 계정은 새 Auth 이전이 끝날 때까지 기존 로그인으로도 들어올 수 있게 유지합니다.
    const passwordHash = await hashPassword(pw);
    const record = await findOwnerRequestByCredentials(username, passwordHash);
    if(!record){ showToast((authError && authError.message) ? authError.message : "아이디 또는 비밀번호가 올바르지 않아요."); return; }
    const remember = state.rememberMeChecked !== false;
    if(remember) localSet("my-request-id", record.id);
    if(record.status === "approved"){
      await loadStoreList(record.username);
      await ensureStoreInList(record.store, record.username);
      state.myRequestId = record.id;
      state.myUsername = record.username;
      state.myStores = await computeMyStoresDb(record.username);
      await becomeStoreOwner(record.store);
    }else if(record.status === "pending"){
      state.pendingStoreForOwner = record.store;
      state.landingMode = "request-pending";
      render();
    }else{
      state.pendingStoreForOwner = record.store;
      state.landingMode = "request-rejected";
      render();
    }
  }

  async function submitPasswordResetRequest(){'''
          s, n = pattern.subn(replacement, s, count=1)
          assert n == 1, n

          changes = {
            '매장 사장님이시군요. 처음이시면 가입 신청, 이미 승인되셨다면 로그인해 주세요.': '매장 사장님이시군요. 처음이시면 회원가입, 기존 계정이 있으시면 로그인해 주세요.',
            'id="store-signup-btn">가입 신청하기</button>': 'id="store-signup-btn">회원가입하기</button>',
            '매장 사장님으로 가입 신청할게요. 승인되면 아이디·비밀번호로 언제든 로그인할 수 있어요.': '매장 사장님 계정을 만들게요. 가입하면 바로 매니를 시작할 수 있어요.',
            'id="owner-request-password-input" type="password" placeholder="4자 이상"': 'id="owner-request-password-input" type="password" placeholder="8자 이상"',
            'id="submit-owner-request-btn">가입 신청하기</button>': 'id="submit-owner-request-btn">회원가입하기</button>',
            'id="store-login-username-input" type="text" placeholder="아이디(이메일 또는 휴대폰 번호)"': 'id="store-login-username-input" type="text" placeholder="아이디"',
            '아직 계정이 없으신가요?<b>가입 신청하기 ›</b>': '아직 계정이 없으신가요?<b>회원가입하기 ›</b>',
          }
          for old, new in changes.items():
            assert old in s, old
            s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
      - name: Commit patched user app
        run: |
          git config user.name 'manee-security-bot'
          git config user.email 'manee-security-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Wire security-v2 to Supabase Auth signup and login'
          git push origin HEAD:security-v2
