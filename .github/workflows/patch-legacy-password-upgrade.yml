name: Patch Legacy Password Upgrade

on:
  push:
    branches: [security-v2]
    paths:
      - '.github/workflows/patch-legacy-password-upgrade.yml'
      - 'security/patch_legacy_password_upgrade.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v2
      - name: Patch first-login password upgrade flow
        run: python security/patch_legacy_password_upgrade.py
      - name: Syntax check inline JavaScript
        shell: bash
        run: |
          python -c "from pathlib import Path; import re; s=Path('index.html').read_text(encoding='utf-8'); blocks=re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>',s,re.S|re.I); Path('/tmp/app.js').write_text('\\n'.join(b for b in blocks if b.strip()),encoding='utf-8')"
          node --check /tmp/app.js
      - name: Commit patched app
        shell: bash
        run: |
          git config user.name 'manee-security-bot'
          git config user.email 'manee-security-bot@users.noreply.github.com'
          git add index.html
          git commit -m 'Add first-login password upgrade for legacy owners'
          git push origin HEAD:security-v2
