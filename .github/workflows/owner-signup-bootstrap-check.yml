name: Owner Signup Bootstrap Check

on:
  push:
    branches: [security-v2]
    paths:
      - '.github/workflows/owner-signup-bootstrap-check.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner signup bootstrap
        shell: bash
        run: |
          set -euo pipefail
          APIKEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' index.html | head -1)
          BASE='https://bhwuuxcrzxespkjlmqxr.supabase.co'
          USERNAME="boot${GITHUB_RUN_ID}"
          PASSWORD="$(openssl rand -hex 12)Aa9"
          STORE_NAME="__Manee Bootstrap ${GITHUB_RUN_ID}"

          SIGNUP=$(curl -sS -X POST "$BASE/functions/v1/manee-signup" \
            -H "apikey: $APIKEY" \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\",\"display_name\":\"테스트 사장\",\"store_name\":\"$STORE_NAME\"}")

          test "$(echo "$SIGNUP" | jq -r '.ok // false')" = 'true'
          USER_ID=$(echo "$SIGNUP" | jq -r '.user.id')
          STORE_ID=$(echo "$SIGNUP" | jq -r '.store.id')
          TOKEN=$(echo "$SIGNUP" | jq -r '.session.access_token // empty')
          test -n "$USER_ID"
          test -n "$STORE_ID"
          test -n "$TOKEN"
          test "$(echo "$SIGNUP" | jq -r '.store.role')" = 'owner'
          echo "signup_bootstrap=true"
          echo "test_user_id=$USER_ID"
          echo "test_store_id=$STORE_ID"
          echo "test_username=$USERNAME"

          PROFILE=$(curl -sS "$BASE/rest/v1/profiles?select=user_id,username" \
            -H "apikey: $APIKEY" -H "Authorization: Bearer $TOKEN")
          MEMBERSHIP=$(curl -sS "$BASE/rest/v1/store_memberships?select=user_id,store_id,role,status" \
            -H "apikey: $APIKEY" -H "Authorization: Bearer $TOKEN")

          test "$(echo "$PROFILE" | jq -r --arg uid "$USER_ID" --arg un "$USERNAME" 'length == 1 and .[0].user_id == $uid and .[0].username == $un')" = 'true'
          test "$(echo "$MEMBERSHIP" | jq -r --arg uid "$USER_ID" --arg sid "$STORE_ID" 'length == 1 and .[0].user_id == $uid and .[0].store_id == $sid and .[0].role == "owner" and .[0].status == "active"')" = 'true'
          echo 'profile_and_owner_membership=true'

          DIRECTORY=$(curl -sS -X POST "$BASE/rest/v1/rpc/get_store_crew_directory" \
            -H "apikey: $APIKEY" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"target_store_id\":\"$STORE_ID\"}")
          test "$(echo "$DIRECTORY" | jq -r 'type == "array" and length == 0')" = 'true'
          echo 'owner_store_access=true'

          LOGIN=$(curl -sS -X POST "$BASE/functions/v1/manee-login" \
            -H "apikey: $APIKEY" -H 'Content-Type: application/json' \
            -d "{\"username\":\"$USERNAME\",\"password\":\"$PASSWORD\"}")
          test "$(echo "$LOGIN" | jq -r '.ok // false')" = 'true'
          test -n "$(echo "$LOGIN" | jq -r '.session.access_token // empty')"
          echo 'relogin=true'

          ADMIN_STATUS=$(curl -sS -o /tmp/admin.json -w '%{http_code}' -X POST "$BASE/rest/v1/platform_admins" \
            -H "apikey: $APIKEY" -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"user_id\":\"$USER_ID\",\"role\":\"super_admin\",\"status\":\"active\"}")
          test "$ADMIN_STATUS" -ge 400
          echo 'hq_escalation_blocked=true'
