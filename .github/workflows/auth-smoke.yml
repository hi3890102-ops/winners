name: Auth Smoke Test

on:
  push:
    branches: [security-v2]
    paths:
      - '.github/workflows/auth-smoke.yml'
      - 'security/auth-smoke-trigger.txt'

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase Auth smoke
        shell: bash
        run: |
          set -euo pipefail
          SUPABASE_URL='https://bhwuuxcrzxespkjlmqxr.supabase.co'
          APIKEY='sb_publishable_Ch-j2871vwK9hgEFTd2xzg_-ara37n0'
          EMAIL="manee-gh-auth-test-${GITHUB_RUN_ID}@example.com"
          PASSWORD="ManeeAuthSmoke!${GITHUB_RUN_ID}Aa"

          LOGIN=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $APIKEY" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
          TOKEN=$(echo "$LOGIN" | jq -r '.access_token // empty')

          if [ -z "$TOKEN" ]; then
            SIGNUP=$(curl -sS -X POST "$SUPABASE_URL/auth/v1/signup" \
              -H "apikey: $APIKEY" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")
            USER_ID=$(echo "$SIGNUP" | jq -r '.user.id // empty')
            SESSION=$(echo "$SIGNUP" | jq -r '.access_token // empty')
            echo "signup_created=$([ -n "$USER_ID" ] && echo true || echo false)"
            echo "signup_user_id=$USER_ID"
            echo "signup_session=$([ -n "$SESSION" ] && echo true || echo false)"
            echo 'NEEDS_DB_SETUP=true'
            exit 78
          fi

          echo 'login_session=true'
          USER_ID=$(echo "$LOGIN" | jq -r '.user.id')
          PROFILE=$(curl -sS "$SUPABASE_URL/rest/v1/profiles?select=user_id,username" \
            -H "apikey: $APIKEY" \
            -H "Authorization: Bearer $TOKEN")
          PROFILE_COUNT=$(echo "$PROFILE" | jq 'length')
          SELF_MATCH=$(echo "$PROFILE" | jq -r --arg uid "$USER_ID" 'length == 1 and .[0].user_id == $uid')
          echo "profile_count=$PROFILE_COUNT"
          echo "profile_self_only=$SELF_MATCH"

          STORE_ID='70ff3e94-cb68-4b8b-ad07-cb19f1eff733'
          DIR=$(curl -sS -X POST "$SUPABASE_URL/rest/v1/rpc/get_store_crew_directory" \
            -H "apikey: $APIKEY" \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"target_store_id\":\"$STORE_ID\"}")
          if echo "$DIR" | jq -e 'type == "array"' >/dev/null; then
            echo "hq_directory_ok=true"
            echo "hq_directory_rows=$(echo "$DIR" | jq 'length')"
          else
            echo "hq_directory_ok=false"
            echo "$DIR" | jq -c '{code,message}'
            exit 1
          fi

          test "$SELF_MATCH" = 'true'
