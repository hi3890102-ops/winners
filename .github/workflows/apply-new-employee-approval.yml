name: Apply new employee approval UI
on:
  push:
    branches: [security-v2]
    paths: ['scripts/apply-new-employee-approval.py','.github/workflows/apply-new-employee-approval.yml','security/new-employee-approval-ui.test.mjs','security/store-staff-new-employee-approval.test.mjs']
permissions:
  contents: write
jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/apply-new-employee-approval.py
      - run: npm ci
      - name: Run all security tests and syntax check
        run: |
          set -o pipefail
          node --test security/*.test.mjs
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';import {Script} from 'node:vm';
          const html=readFileSync('index.html','utf8');let count=0;
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)){
            if(/src=|application\/ld\+json/.test(m[1])||!m[2].trim())continue;
            new Script(m[2]);count++;
          }
          console.log('Inline script syntax verified:',count);
          JS
      - name: Commit tested UI and remove temporary helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/apply-new-employee-approval.py .github/workflows/apply-new-employee-approval.yml
          git add -u -- index.html scripts .github/workflows
          if ! git diff --cached --quiet; then
            git commit -m 'Allow new staff approval without an existing employee record'
            git push origin HEAD:security-v2
          fi
