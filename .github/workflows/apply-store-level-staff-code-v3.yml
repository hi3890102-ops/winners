name: Apply store-level staff connection code v3

on:
  push:
    branches:
      - security-v2
    paths:
      - '.github/workflows/apply-store-level-staff-code-v3.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix local patch helpers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-store-level-staff-code.py')
          t=p.read_text(encoding='utf-8')
          t=t.replace("text2,count=re.subn(pattern,repl,text,count=1,flags=re.S)","text2,count=re.subn(pattern,lambda _m: repl,text,count=1,flags=re.S)",1)
          p.write_text(t,encoding='utf-8')
          p=Path('security/store-staff-link-code-database.test.mjs')
          t=p.read_text(encoding='utf-8')
          t=t.replace("set_config('request.jwt.claim.sub',$1,true),set_config('request.jwt.claim.role',$2,true)","set_config('request.jwt.claim.sub',$1,false),set_config('request.jwt.claim.role',$2,false)",1)
          t=t.replace("set_config('request.jwt.claims',$1,true)","set_config('request.jwt.claims',$1,false)",1)
          t=t.replace("await db.exec('set local role '+dbRole);","await db.exec('set role '+dbRole);",1)
          p.write_text(t,encoding='utf-8')
          PY
      - name: Apply UI patch
        run: python scripts/apply-store-level-staff-code.py
      - name: Install test dependencies
        run: npm ci
      - name: Run connection tests
        run: node --test security/staff-auth-ui.test.mjs security/store-staff-link-code-ui.test.mjs security/store-staff-link-code-database.test.mjs
      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html security/store-staff-link-code-database.test.mjs
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Use store-level staff connection codes"
          git push origin HEAD:security-v2
