name: Apply store-level staff connection code v2

on:
  push:
    branches:
      - security-v2
    paths:
      - '.github/workflows/apply-store-level-staff-code-v2.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix patch helper replacement handling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply-store-level-staff-code.py')
          t=p.read_text(encoding='utf-8')
          old="text2,count=re.subn(pattern,repl,text,count=1,flags=re.S)"
          new="text2,count=re.subn(pattern,lambda _m: repl,text,count=1,flags=re.S)"
          if old not in t:
              raise SystemExit('patch helper anchor not found')
          p.write_text(t.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply UI patch
        run: python scripts/apply-store-level-staff-code.py
      - name: Install test dependencies
        run: npm ci
      - name: Run connection tests
        run: node --test security/staff-auth-ui.test.mjs security/store-staff-link-code-ui.test.mjs security/store-staff-link-code-database.test.mjs
      - name: Commit tested UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated UI changes"
            exit 0
          fi
          git commit -m "Use store-level staff connection codes"
          git push origin HEAD:security-v2
