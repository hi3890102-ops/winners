name: Verify store-code release
on:
  push:
    branches: [main, security-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Every day at 07:17 Asia/Seoul (22:17 UTC on the previous day).
    - cron: '17 22 * * *'
permissions:
  contents: read
concurrency:
  group: store-code-verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: manee_code_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MANEE_TEST_DATABASE_URL: postgresql://postgres:local_ci_only@127.0.0.1:5432/manee_code_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Ensure PostgreSQL client
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y postgresql-client)
      - name: Ensure PDF inspection tools
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: All security and concurrent connection tests
        run: |
          set -o pipefail
          # These suites create cluster-wide roles. Keep setup sequential;
          # competing requests within each suite still run concurrently.
          node --test security/store-code-concurrency.test.mjs | tee /tmp/store-code-tests.txt
          node --test security/new-staff-self-profile-concurrency.test.mjs | tee -a /tmp/store-code-tests.txt
          node --test security/attendance-concurrency.test.mjs | tee -a /tmp/store-code-tests.txt
          env -u MANEE_TEST_DATABASE_URL node --test security/*.test.mjs tests/*.test.mjs | tee -a /tmp/store-code-tests.txt
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';import {Script} from 'node:vm';
          const html=readFileSync('index.html','utf8');let count=0;
          for(const m of html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)){
            if(/src=|application\/ld\+json/.test(m[1])||!m[2].trim())continue;
            new Script(m[2]);count++;
          }
          console.log('Inline script syntax verified:',count);
          JS
      - name: Verify staging and production builds
        run: |
          CONTEXT=deploy-preview node scripts/build-environment.mjs
          CONTEXT=production BRANCH=main node scripts/build-environment.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-code-tests
          path: /tmp/store-code-tests.txt
          retention-days: 14
  public-site:
    name: Public app availability (read only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-public-sites.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-app-check
          path: monitoring-results.json
          retention-days: 14
