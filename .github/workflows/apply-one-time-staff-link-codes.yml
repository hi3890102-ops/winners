name: Apply one-time staff link codes

on:
  push:
    branches:
      - security-v2
    paths:
      - 'scripts/apply-one-time-staff-link-codes.py'
      - '.github/workflows/apply-one-time-staff-link-codes.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python scripts/apply-one-time-staff-link-codes.py
      - name: Install test dependencies
        run: npm ci
      - name: Run staff link tests
        run: node --test security/staff-auth-database.test.mjs security/staff-auth-ui.test.mjs security/staff-link-one-time-code-ui.test.mjs
      - name: Commit tested changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html security/staff-auth.sql security/staff-auth-production-foundation.sql security/staff-auth-database.test.mjs security/staff-link-one-time-code-ui.test.mjs security/staff-link-one-time-codes.sql security/staff-link-one-time-codes-rollback.sql security/production-rollout.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Use one-time staff connection codes"
          git push origin HEAD:security-v2
