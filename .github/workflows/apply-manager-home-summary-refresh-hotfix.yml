name: Apply manager home summary refresh hotfix

on:
  push:
    branches:
      - hotfix-manager-home-summary-refresh
    paths:
      - '.github/workflows/apply-manager-home-summary-refresh-hotfix.yml'
      - 'scripts/apply-manager-home-summary-refresh-hotfix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-manager-home-summary-refresh
      - name: Apply patch
        run: python scripts/apply-manager-home-summary-refresh-hotfix.py
      - name: Commit generated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Fix manager home summary after refresh"
          git push origin HEAD:hotfix-manager-home-summary-refresh
