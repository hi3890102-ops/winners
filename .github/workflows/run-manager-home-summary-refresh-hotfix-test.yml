name: Manager home summary refresh hotfix test

on:
  push:
    branches:
      - hotfix-manager-home-summary-refresh
    paths:
      - '.github/workflows/run-manager-home-summary-refresh-hotfix-test.yml'
      - 'security/manager-home-summary-refresh-hotfix.test.mjs'
      - 'index.html'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-manager-home-summary-refresh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test security/manager-home-summary-refresh-hotfix.test.mjs
