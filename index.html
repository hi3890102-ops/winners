      html += '<div style="margin-bottom:10px;display:flex;flex-direction:column;gap:8px;">';
      msgs.forEach(msg=>{
        if(msg.role==="user"){
          html += '<div style="align-self:flex-end;max-width:85%;background:var(--brick);color:#fff;border-radius:12px 12px 2px 12px;padding:9px 12px;font-size:13px;">'+escapeHtml(msg.content)+'</div>';
        }else{
          let displayText = "";
          try{
            const parsed = JSON.parse(msg.content);
            displayText = parsed.type==="action" ? (parsed.confirmText||"실행을 확인해 주세요.") : (parsed.text||"");
          }catch(e){ displayText = msg.content; }
          html += '<div style="align-self:flex-start;max-width:85%;background:var(--cream);color:var(--ink);border-radius:12px 12px 12px 2px;padding:9px 12px;font-size:13px;white-space:pre-wrap;line-height:1.5;">'+escapeHtml(displayText)+'</div>';
        }
      });
      html += '</div>';
    }

    if(state.askAppPendingAction){
      html += '<div style="background:#FFF4E5;border:1px solid #FFD9A0;border-radius:10px;padding:10px 12px;margin-bottom:10px;">';
      html += '<p style="font-size:12.5px;color:#8A5A00;margin:0 0 8px;">'+escapeHtml(state.askAppPendingAction.confirmText||"실행할까요?")+'</p>';
      html += '<div style="display:flex;gap:8px;"><button class="crew-code-btn" id="ask-app-confirm-btn" style="flex:1;background:var(--olive);color:#fff;border-color:var(--olive);">확인</button><button class="crew-code-btn" id="ask-app-cancel-btn" style="flex:1;">취소</button></div>';
      html += '</div>';
    }

    html += '<div class="add-row" style="padding:0;background:transparent;">';
    html += '<input id="ask-app-input" type="text" placeholder="질문을 입력해 주세요" style="flex:1;min-width:0;" onkeydown="if(event.key===\'Enter\'){event.preventDefault();document.getElementById(\'ask-app-btn\').click();}">';
    html += '<button type="button" id="ask-app-mic-btn" style="flex:0 0 44px;padding:0;">🎤</button>';
    html += '<button id="ask-app-btn">'+(state.askAppLoading?'답변 중…':'물어보기')+'</button>';
    html += '</div>';
    if(state.askAppLoading){
      html += '<p class="crew-code-hint" style="margin-top:10px;">데이터를 살펴보고 있어요…</p>';
    }
    html += '</div>';

    html += '<div class="pay-summary c-blue">';
    html += '<p class="label">'+(state.role==="hq"?"전체 매장 합산 매출":"내 매장 합산 매출")+' (이번 달 누적)</p>';
    html += '<p class="amount">'+totalSales.toLocaleString()+'원</p>';
    html += '<p class="meta">전체 배달매출 '+totalDelivery.toLocaleString()+'원 (별도 집계)</p>';
    html += '<p class="meta" style="margin-top:4px;">전체 인건비 '+totalPay.toLocaleString()+'원 · 매출 대비 '+overallRatio.toFixed(1)+'%</p>';
    html += '<p class="meta" style="margin-top:4px;">전체 식자재비 '+totalExpense.toLocaleString()+'원 · 매출 대비 '+overallExpenseRatio.toFixed(1)+'%</p>';
    html += '</div>';

    data.forEach(d=>{
      const ratioColor = d.laborRatio===null ? "var(--ink-soft)" : (d.laborRatio>25 ? "var(--danger)" : "var(--olive)");
      const ratioText = d.laborRatio===null ? "—" : d.laborRatio.toFixed(1)+"%";
      const ratioStatus = d.laborRatio===null ? "" : (d.laborRatio>25 ? '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--danger);margin-top:2px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--danger);display:inline-block;"></span>관리필요</span>' : '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--olive);margin-top:2px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--olive);display:inline-block;"></span>안정</span>');
      const foodColor = d.expenseRatio===null ? "var(--ink-soft)" : (d.expenseRatio>40 ? "var(--danger)" : "var(--olive)");
      const foodText = d.expenseRatio===null ? "—" : d.expenseRatio.toFixed(1)+"%";
      const foodStatus = d.expenseRatio===null ? "" : (d.expenseRatio>40 ? '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--danger);margin-top:2px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--danger);display:inline-block;"></span>관리필요</span>' : '<span style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--olive);margin-top:2px;"><span style="width:6px;height:6px;border-radius:50%;background:var(--olive);display:inline-block;"></span>안정</span>');
      const checklistColor = d.checklistPct===null ? "var(--ink-soft)" : (d.checklistPct>=100 ? "var(--olive)" : "var(--gold)");
      const checklistText = d.checklistPct===null ? "—" : d.checklistPct+"%";
      html += '<div class="category" style="padding:14px 16px;">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:800;font-size:14px;">'+escapeHtml(d.store)+'</span><span style="font-size:11px;color:var(--ink-soft);">스텝 '+d.crewCount+'명</span></div>';
      html += '<div style="display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;">';
      html += '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--ink-soft);">매출</div><div style="font-weight:700;font-size:13.5px;margin-top:2px;">'+d.salesSum.toLocaleString()+'원</div></div>';
      html += '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--ink-soft);">배달매출</div><div style="font-weight:700;font-size:13.5px;margin-top:2px;">'+(d.deliverySum||0).toLocaleString()+'원</div></div>';
      html += '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--ink-soft);">인건비율</div><div style="font-weight:700;font-size:13.5px;margin-top:2px;color:'+ratioColor+';">'+ratioText+'</div>'+ratioStatus+'</div>';
      html += '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--ink-soft);">식자재비율</div><div style="font-weight:700;font-size:13.5px;margin-top:2px;color:'+foodColor+';">'+foodText+'</div>'+foodStatus+'</div>';
      html += '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--ink-soft);">오늘 체크리스트</div><div style="font-weight:700;font-size:13.5px;margin-top:2px;color:'+checklistColor+';">'+checklistText+'</div></div>';
      html += '</div></div>';
    });
    return html;
  }

  function renderAnnouncementsOwnerTab(){
    let html = '<button class="landing-btn secondary" id="toggle-ann-form-btn" style="margin-bottom:14px;">'+(state.showAnnounceForm?'취소':'+ 새 공지 작성')+'</button>';
    if(state.showAnnounceForm) html += renderAnnounceForm();
    if(state.announcements.length===0){
      html += '<div class="empty-note">등록된 공지사항이 없어요.</div>';
      return html;
    }
    const totalStaff = state.crew.length;
    state.announcements.forEach(a=>{
      const readCount = a.reads ? Object.keys(a.reads).length : 0;
      const unread = state.crew.filter(c=> !(a.reads && a.reads[c.id]));
      html += '<div class="category" style="padding:16px;margin-bottom:12px;">';
      html += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">';
      html += '<div><div style="font-weight:800;font-size:14.5px;">'+escapeHtml(a.title)+'</div><div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">'+escapeHtml(a.authorName)+' · '+formatDateLabel(new Date(a.createdAt).toISOString().slice(0,10))+'</div></div>';
      html += '<button class="crew-del" data-delann="'+a.id+'">삭제</button>';
      html += '</div>';
      if(a.body) html += '<p style="font-size:13.5px;margin:10px 0 0;line-height:1.5;white-space:pre-wrap;">'+escapeHtml(a.body)+'</p>';
      html += '<p class="crew-code-hint" style="margin-top:10px;">확인 '+readCount+'/'+totalStaff+'명</p>';
      if(unread.length>0){
        html += '<p style="font-size:12.5px;color:var(--ink-soft);margin-top:4px;">미확인: '+unread.map(c=>escapeHtml(c.name)).join(', ')+'</p>';
      }
      html += '</div>';
    });
    return html;
  }

  function renderChecklist(){
    const viewDate = state.checklistViewDate || bizToday();
    const isToday = viewDate === bizToday();
    const logEntry = state.checklistLog ? state.checklistLog[viewDate] : null;
    const isClosed = !!(logEntry && logEntry.closedAt);

    let html = "";
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">';
    html += '<span style="font-size:13px;color:var(--ink-soft);font-weight:700;">'+(isToday?'오늘':formatDateLabel(viewDate))+(isClosed?' · 마감됨':'')+'</span>';
    html += '<button class="crew-code-btn" id="toggle-checklist-cal-btn">'+(state.showChecklistCalendar?'닫기':'지난 기록 보기')+'</button>';
    html += '</div>';
    if(!isToday && !state.showChecklistCalendar){
      html += '<button class="switch-link" id="checklist-today-btn" style="margin:-6px 0 12px;text-align:left;">‹ 오늘로 돌아가기</button>';
    }
    if(state.showChecklistCalendar){
      html += renderChecklistCalendar();
      return html;
    }

    const all = countAll();
    const pct = all.total ? Math.round((all.done/all.total)*100) : 0;
    const r=31, c=2*Math.PI*r, dash = c*(pct/100);
    html += '<div class="hero">';
    html += '<div class="ring-wrap"><svg viewBox="0 0 78 78"><circle class="ring-bg" cx="39" cy="39" r="'+r+'"/><circle class="ring-fg" cx="39" cy="39" r="'+r+'" stroke-dasharray="'+dash+' '+c+'"/></svg><div class="ring-pct">'+pct+'%</div></div>';
    html += '<div class="hero-text"><p class="lead">'+state.store+' 진행 상황</p><p class="big"><em>'+all.done+'</em> / '+all.total+'개 완료</p></div>';
    html += '</div>';

    html += '<div class="seg">';
    TABS.forEach(t=>{
      const tc = countTab(t.id);
      html += '<button class="'+(t.id===state.tab?'active':'')+'" data-tab="'+t.id+'">'+t.label+'<span class="count">'+tc.done+'/'+tc.total+'</span></button>';
    });
    html += '</div>';

    const cats = state.items[state.tab] || [];
    const canEdit = canEditChecklistItems();
    if(cats.length===0) html += '<div class="empty-note">아직 등록된 항목이 없어요.</div>';
    cats.forEach(cat=>{
      const done = cat.items.filter(it=>state.checks[it.id]).length;
      html += '<div class="category">';
      html += '<div class="category-head"><h2>'+cat.name+'</h2><span class="cat-progress">'+done+'/'+cat.items.length+'</span></div>';
      cat.items.forEach((it,idx)=>{
        const checked = !!state.checks[it.id];
        html += '<div class="item-row'+(checked?' done':'')+'">';
        html += '<span class="step-no">'+(idx+1)+'</span>';
        html += '<div class="checkbox'+(checked?' checked':'')+'" data-item="'+it.id+'"'+(isClosed?' style="opacity:.5;pointer-events:none;"':'')+'>'+checkSvg()+'</div>';
        html += '<span class="item-label">'+it.label+'</span>';
        if(canEdit && !isClosed){
          html += '<button class="item-del" data-delitem="'+cat.id+':'+it.id+'">삭제</button>';
        }
        html += '</div>';
      });
      if(!isClosed && canEdit){
        html += '<div class="add-row"><input id="add-input-'+cat.id+'" type="text" placeholder="항목 추가"><button data-addcat="'+cat.id+'">추가</button></div>';
      }
      html += '</div>';
    });

    if(isClosed){
      html += '<div class="reset-bar"><button id="reopen-checklist-btn">다시 열기</button></div>';
    }else{
      html += '<div class="reset-bar"><button id="reset-btn">체크 전체 초기화</button></div>';
      html += '<button class="landing-btn primary" id="close-checklist-btn" style="margin-top:4px;">마감하기</button>';
    }
    return html;
  }

  function renderChecklistCalendar(){
    const y=state.monthYear, m=state.monthNum;
    const totalDays = daysInMonth(y,m);
    const leadEmpty = firstWeekdayMon0(y,m);
    let html = '<div class="month-nav"><button id="prev-month">‹</button><span class="month-label">'+y+'년 '+m+'월</span><button id="next-month">›</button></div>';
    html += '<div class="cal-grid">';
    DOW_LABELS.forEach(dl=> html += '<div class="cal-dow">'+dl+'</div>');
    for(let i=0;i<leadEmpty;i++) html += '<div class="cal-day empty"></div>';
    for(let d=1; d<=totalDays; d++){
      const dateStr = y+"-"+pad(m)+"-"+pad(d);
      const isToday = dateStr === bizToday();
      const entry = state.checklistLog ? state.checklistLog[dateStr] : null;
      const closed = !!(entry && entry.closedAt);
      html += '<div class="cal-day'+(isToday?' today':'')+'" data-checklistdate="'+dateStr+'">';
      html += d + (closed ? '<span class="dot dot-done"></span>' : '');
      html += '</div>';
    }
    html += '</div>';
    html += '<p class="crew-code-hint">초록 점이 있는 날은 마감된 체크리스트예요. 날짜를 누르면 그날 기록을 볼 수 있어요.</p>';
    return html;
  }

  function renderSchedule(){
    let html = '<div class="subnav">';
    html += '<button class="'+(state.scheduleTab==="calendar"?"active":"")+'" data-stab="calendar">스케줄</button>';
    html += '<button class="'+(state.scheduleTab==="crew"?"active":"")+'" data-stab="crew">스텝 관리</button>';
    html += '</div>';
    if(state.scheduleTab === "crew") html += renderCrewManage();
    else html += renderCalendar();
    return html;
  }

  function renderSalesSection(){
    let html = '<div class="subnav">';
    html += '<button class="'+(state.salesSectionTab==="pay"?"active":"")+'" data-salestab="pay">급여</button>';
    html += '<button class="'+(state.salesSectionTab==="sales"?"active":"")+'" data-salestab="sales">매출보고</button>';
    html += '<button class="'+(state.salesSectionTab==="report"?"active":"")+'" data-salestab="report">월말리포트</button>';
    html += '</div>';
    if(state.salesSectionTab === "sales") html += renderSalesReportsOwnerTab();
    else if(state.salesSectionTab === "report") html += renderMonthlyReport();
    else html += renderPay();
    return html;
  }

  function renderMonthlyReport(){
    const y = state.monthYear, m = state.monthNum;
    let html = '<div class="month-nav"><button id="prev-month">‹</button><span class="month-label">'+y+'년 '+m+'월</span><button id="next-month">›</button></div>';

    let totalSales=0, totalBaemin=0, totalCoupang=0, totalYogiyo=0;
    state.salesReports.forEach(r=>{
      totalSales += Number(r.totalSales)||0;
      totalBaemin += Number(r.deliveryBaemin)||0;
      totalCoupang += Number(r.deliveryCoupang)||0;
      totalYogiyo += Number(r.deliveryYogiyo)||0;
    });
    const totalDelivery = totalBaemin+totalCoupang+totalYogiyo;
    const reportedDays = state.salesReports.length;
    const lastDay = daysInMonth(y, m);

    html += '<div class="pay-summary c-blue" style="margin-bottom:14px;">';
    html += '<p class="label">'+y+'년 '+m+'월 매출 합산 ('+reportedDays+'/'+lastDay+'일 보고됨)</p>';
    html += '<p class="amount">'+totalSales.toLocaleString()+'원</p>';
    html += '<p class="meta">배달매출 '+totalDelivery.toLocaleString()+'원 (배민 '+totalBaemin.toLocaleString()+'원 · 쿠팡 '+totalCoupang.toLocaleString()+'원 · 요기요 '+totalYogiyo.toLocaleString()+'원)</p>';
    html += '</div>';

    const vendorBreakdown = computeVendorBreakdown();
    let totalExpense = 0; vendorBreakdown.forEach(v=> totalExpense += v.amount);
    const expenseRatio = totalSales>0 ? (totalExpense/totalSales*100) : null;
    html += '<div class="day-panel" style="margin-bottom:14px;">';
    html += '<h3>지출 합산 (거래처별)</h3>';
    if(vendorBreakdown.length===0){
      html += '<div class="empty-note" style="padding:8px 0;">등록된 지출이 없어요.</div>';
    }else{
      vendorBreakdown.forEach(v=>{
        const pct = totalExpense>0 ? (v.amount/totalExpense*100) : 0;
        html += '<div class="pay-list-item"><span class="d">'+escapeHtml(v.name)+'</span><span>'+v.amount.toLocaleString()+'원 · '+pct.toFixed(1)+'%</span></div>';
      });
      html += '<div class="pay-list-item" style="font-weight:800;border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;"><span class="d">합계</span><span>'+totalExpense.toLocaleString()+'원'+(expenseRatio!==null?' (매출대비 '+expenseRatio.toFixed(1)+'%)':'')+'</span></div>';
    }
    html += '</div>';

    let totalLabor = 0;
    const perPerson = state.crew.map(c=>{
      const info = calcCrewPay(c, y, m);
      totalLabor += info.pay;
      return { name: c.name, pay: info.pay, hours: info.hours, days: info.days };
    }).sort((a,b)=> b.pay-a.pay);
    const laborRatio = totalSales>0 ? (totalLabor/totalSales*100) : null;

    html += '<div class="day-panel" style="margin-bottom:14px;">';
    html += '<h3>인건비 합산 (개인별)</h3>';
    if(perPerson.length===0){
      html += '<div class="empty-note" style="padding:8px 0;">등록된 스텝이 없어요.</div>';
    }else{
      perPerson.forEach(p=>{
        html += '<div class="pay-list-item"><span class="d">'+escapeHtml(p.name)+'</span><span>'+p.pay.toLocaleString()+'원 · '+p.days+'일 · '+p.hours.toFixed(1)+'시간</span></div>';
      });
      html += '<div class="pay-list-item" style="font-weight:800;border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;"><span class="d">합계</span><span>'+totalLabor.toLocaleString()+'원'+(laborRatio!==null?' (매출대비 '+laborRatio.toFixed(1)+'%)':'')+'</span></div>';
    }
    html += '</div>';

    let totalFixed = 0;
    state.fixedExpenses.forEach(f=> totalFixed += Number(f.amount)||0);
    html += '<div class="day-panel" style="margin-bottom:14px;">';
    html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><h3 style="margin:0;">고정지출</h3><button class="crew-code-btn" id="toggle-fixedexpense-manage-btn">'+(state.showFixedExpenseManage?'닫기':'관리')+'</button></div>';
    if(state.fixedExpenses.length===0){
      html += '<div class="empty-note" style="padding:8px 0;">등록된 고정지출이 없어요.</div>';
    }else{
      state.fixedExpenses.forEach(f=>{
        html += '<div class="pay-list-item"><span class="d">'+escapeHtml(f.name)+'</span><span>'+f.amount.toLocaleString()+'원</span></div>';
      });
      html += '<div class="pay-list-item" style="font-weight:800;border-top:1px dashed var(--line);margin-top:4px;padding-top:8px;"><span class="d">합계</span><span>'+totalFixed.toLocaleString()+'원</span></div>';
    }
    html += '</div>';
    if(state.showFixedExpenseManage) html += renderFixedExpenseManage();

    const netProfit = totalSales - totalExpense - totalLabor - totalFixed;
    const laborDanger = laborRatio!==null && laborRatio>25;
    const foodDanger = expenseRatio!==null && expenseRatio>40;
    html += '<div class="pay-summary c-green" style="margin-bottom:14px;">';
    html += '<p class="label">이번 달 순수익 (예상) · 종합비율</p>';
    html += '<p class="amount">'+netProfit.toLocaleString()+'원</p>';
    html += '<p class="meta">매출 '+totalSales.toLocaleString()+'원 − 지출 '+totalExpense.toLocaleString()+'원 − 인건비 '+totalLabor.toLocaleString()+'원 − 고정지출 '+totalFixed.toLocaleString()+'원</p>';
    html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.25);">';
    html += '<p class="meta">인건비율 '+(laborRatio!==null?laborRatio.toFixed(1):"0.0")+'% · 식자재비율 '+(expenseRatio!==null?expenseRatio.toFixed(1):"0.0")+'%</p>';
    if(laborRatio!==null){
      html += '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:'+(laborDanger?'#FF8A8F':'#7CE6A6')+';margin-top:6px;margin-right:14px;"><span style="width:6px;height:6px;border-radius:50%;background:'+(laborDanger?'#FF8A8F':'#7CE6A6')+';display:inline-block;"></span>인건비 '+(laborDanger?'관리필요':'안정')+'</span>';
    }
    if(expenseRatio!==null){
      html += '<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:'+(foodDanger?'#FF8A8F':'#7CE6A6')+';margin-top:6px;"><span style="width:6px;height:6px;border-radius:50%;background:'+(foodDanger?'#FF8A8F':'#7CE6A6')+';display:inline-block;"></span>식자재 '+(foodDanger?'관리필요':'안정')+'</span>';
    }
    html += '</div></div>';

    html += '<button class="crew-code-btn" id="export-monthly-report-excel-btn">이번 달 리포트 엑셀로 내보내기</button>';
    return html;
  }

  function renderVendorManage(){
    let html = '<div class="day-panel">';
    html += '<h3>거래처 관리</h3>';

  function detectSalesAnomaly(dateStr, report){
    if(!report) return null;
    const others = state.salesReports.filter(r=> r.date!==dateStr && Number(r.totalSales)>0);
    if(others.length < 3) return null;
    let sum = 0;
    others.forEach(r=> sum += Number(r.totalSales)||0);
    const avg = sum / others.length;
    if(avg <= 0) return null;
    const today = Number(report.totalSales)||0;
    const diffPct = ((today - avg) / avg) * 100;
    if(diffPct <= -30){
      return { type:"low", text:"오늘 매출이 이번 달 평균("+Math.round(avg).toLocaleString()+"원)보다 "+Math.abs(Math.round(diffPct))+"% 낮아요. 확인해보시는 게 좋을 것 같아요." };
    }
    if(diffPct >= 50){
      return { type:"high", text:"오늘 매출이 이번 달 평균("+Math.round(avg).toLocaleString()+"원)보다 "+Math.round(diffPct)+"% 높아요. 특별한 날이었는지 확인해보세요." };
    }
    const cashPlusCard = (Number(report.cashSales)||0) + (Number(report.cardSales)||0) + (Number(report.emoneySales)||0) + (Number(report.deliveryBaemin)||0) + (Number(report.deliveryCoupang)||0) + (Number(report.deliveryYogiyo)||0);
    const netForCheck = Number(report.netSales)||0;
    if(netForCheck>0 && Math.abs(cashPlusCard - netForCheck) > netForCheck*0.1 && cashPlusCard>0){
      return { type:"mismatch", text:"현금+카드+배달매출 합계가 순매출과 좀 차이나요. 입력값을 한 번 확인해보세요." };
    }
    return null;
  }

    let html = "";
    if(state.crew.length===0){
      html += '<div class="empty-note">먼저 "스텝 관리"에서 스텝을 등록해 주세요.</div>';
      return html;
    }
    // total across all crew, this month (confirmed attendance only)
    let grandHours = 0, grandPay = 0;
    state.crew.forEach(c=>{
      const info = calcCrewPay(c, state.monthYear, state.monthNum);
      grandHours += info.hours;
      grandPay += info.pay;
    });
    let salesSum = 0;
    state.salesReports.forEach(r=> salesSum += Number(r.totalSales)||0);
    const laborRatio = salesSum>0 ? (grandPay/salesSum*100) : 0;

    html += '<div class="pay-summary c-blue">';
    html += '<p class="label">'+state.monthYear+'년 '+state.monthNum+'월 예상 총 급여 (근무확인 기준)</p>';
    html += '<p class="amount">'+grandPay.toLocaleString()+'원</p>';
    html += '<p class="meta">스텝 '+state.crew.length+'명 · 총 '+grandHours.toFixed(1)+'시간</p>';
    html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.15);">';
    html += '<p class="meta">'+state.monthNum+'월 예상 총매출 (현재까지 누적) · '+salesSum.toLocaleString()+'원</p>';
    html += '<p class="meta">매출 대비 인건비 · '+(salesSum>0 ? laborRatio.toFixed(1) : "0.0")+'%</p>';
    html += '</div>';
    html += '</div>';
    html += '<button class="landing-btn secondary" id="export-excel-btn" style="margin-bottom:14px;">엑셀로 내보내기 (이번 달 출퇴근 기록)</button>';

    if(!state.payCrewId || !state.crew.find(c=>c.id===state.payCrewId)){
      state.payCrewId = state.crew[0].id;
    }
    html += '<select class="pay-select" id="pay-crew-select">';
    state.crew.forEach(c=> html += '<option value="'+c.id+'"'+(c.id===state.payCrewId?' selected':'')+'>'+c.name+' ('+(c.position||"홀")+')</option>');
    html += '</select>';

    const person = state.crew.find(c=>c.id===state.payCrewId);
    const personInfo = calcCrewPay(person, state.monthYear, state.monthNum);
    const myAttConfirmed = state.attendance.filter(a=>a.crewId===state.payCrewId && a.checkOut && a.confirmed).sort((a,b)=>a.date.localeCompare(b.date));
    const myAttPending = state.attendance.filter(a=>a.crewId===state.payCrewId && a.checkOut && !a.confirmed).sort((a,b)=>a.date.localeCompare(b.date));

    html += '<div class="pay-summary c-teal">';
    html += '<p class="label">'+person.name+' 예상 급여 · '+(person.wageType==="monthly"?"월급":"시급")+' 방식'+(person.probation?' · 수습 적용':'')+'</p>';
    html += '<p class="amount">'+personInfo.pay.toLocaleString()+'원</p>';
    if(person.wageType==="monthly"){
      html += '<p class="meta">근무 '+personInfo.days+'일 (이번달 '+daysInMonth(state.monthYear,state.monthNum)+'일 중) · 월급 '+person.wage.toLocaleString()+'원 · 일할 계산</p>';
    }else{
      html += '<p class="meta">근무 '+personInfo.days+'일 · 총 '+personInfo.hours.toFixed(1)+'시간 · 시급 '+person.wage.toLocaleString()+'원</p>';
    }
    const personNet = computeNetPay(person, personInfo.pay);
    if(personNet.taxRate > 0){
      html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.15);">';
      html += '<p class="meta">세금 ('+personNet.taxLabel+') (-)'+personNet.taxAmount.toLocaleString()+'원</p>';
      html += '<p class="meta" style="font-size:15px;color:var(--brick-dim);font-weight:700;">실수령 예상액 '+personNet.netPay.toLocaleString()+'원</p>';
      html += '</div>';
    }
    html += '</div>';

    if(myAttPending.length>0){
      html += '<div class="empty-note" style="background:#FFF3E0;border-radius:12px;padding:12px;text-align:left;margin-bottom:14px;">매니저 근무확인을 기다리는 근무가 '+myAttPending.length+'건 있어요. 확인 전에는 급여에 반영되지 않아요.</div>';
    }

    if(myAttConfirmed.length===0){
      html += '<div class="empty-note">이번 달 확인된 출퇴근 기록이 없어요.</div>';
    }else{
      html += '<div class="category">';
      myAttConfirmed.forEach(a=>{
        const dObj = new Date(a.date);
        html += '<div class="pay-list-item"><span class="d">'+(dObj.getMonth()+1)+'/'+dObj.getDate()+' · '+a.checkIn+'–'+a.checkOut+'</span><span>'+hoursBetween(a.checkIn,a.checkOut).toFixed(1)+'시간</span></div>';
      });
      html += '</div>';
    }
    return html;
  }

    const openFixedBtn = document.getElementById("open-fixed-btn");
    if(openFixedBtn) openFixedBtn.addEventListener("click", openFixedPanel);
    const closeFixedBtn = document.getElementById("close-fixed-btn");
    if(closeFixedBtn) closeFixedBtn.addEventListener("click", closeFixedPanel);
    const fixedCrewSel = document.getElementById("fixed-crew-select");
    if(fixedCrewSel) fixedCrewSel.addEventListener("change", ()=>{ state.fixedDraft.crewId = fixedCrewSel.value; });
    ["fixed-start","fixed-end"].forEach(prefix=>{
      ["ampm","hour","min"].forEach(part=>{
        const el = document.getElementById(prefix+"-"+part);
        if(el) el.addEventListener("change", ()=>{
          const val = readTimeSelect(prefix);
          if(prefix==="fixed-start") state.fixedDraft.start = val; else state.fixedDraft.end = val;
        });
      });
    });
    app.querySelectorAll(".day-chip[data-day]").forEach(btn=>{
      btn.addEventListener("click", ()=> toggleFixedDay(parseInt(btn.getAttribute("data-day"),10)));
    });
    const saveFixedBtn = document.getElementById("save-fixed-btn");
    if(saveFixedBtn) saveFixedBtn.addEventListener("click", saveFixedPattern);
    app.querySelectorAll("[data-delfixed]").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteFixedPattern(btn.getAttribute("data-delfixed")));
    });
    const applyFixedBtn = document.getElementById("apply-fixed-btn");
    if(applyFixedBtn) applyFixedBtn.addEventListener("click", applyFixedToMonth);
  }

  function bindChecklistEvents(){
    app.querySelectorAll("[data-tab]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.tab = btn.getAttribute("data-tab"); render(); });
    });
    app.querySelectorAll(".checkbox").forEach(box=>{
      box.addEventListener("click", ()=> toggleItem(box.getAttribute("data-item")));
    });
    app.querySelectorAll("[data-addcat]").forEach(btn=>{
      btn.addEventListener("click", ()=> addItem(btn.getAttribute("data-addcat")));
    });
    app.querySelectorAll("[data-delitem]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const [catId, itemId] = btn.getAttribute("data-delitem").split(":");
        deleteChecklistItem(catId, itemId);
      });
    });
    app.querySelectorAll(".add-row input").forEach(inp=>{
      inp.addEventListener("keydown",(e)=>{ if(e.key==="Enter") addItem(inp.id.replace("add-input-","")); });
    });
    const resetBtn = document.getElementById("reset-btn");
    if(resetBtn) resetBtn.addEventListener("click", ()=>{
      askConfirm("체크한 항목을 모두 초기화할까요?", ()=>{
        state.checks = {}; render(); saveChecks(); showToast("초기화했어요");
      });
    });
    const closeChecklistBtn = document.getElementById("close-checklist-btn");
    if(closeChecklistBtn) closeChecklistBtn.addEventListener("click", ()=>{
      askConfirm("체크리스트를 마감할까요? 마감하면 오늘 기록으로 남고, 다시 열기 전까진 체크를 바꿀 수 없어요.", closeChecklistDay);
    });
    const reopenChecklistBtn = document.getElementById("reopen-checklist-btn");
    if(reopenChecklistBtn) reopenChecklistBtn.addEventListener("click", reopenChecklistDay);
    const toggleCalBtn = document.getElementById("toggle-checklist-cal-btn");
    if(toggleCalBtn) toggleCalBtn.addEventListener("click", ()=>{ state.showChecklistCalendar = !state.showChecklistCalendar; render(); });
    const checklistTodayBtn = document.getElementById("checklist-today-btn");
    if(checklistTodayBtn) checklistTodayBtn.addEventListener("click", async ()=>{
      state.loading = true; render();
      await loadChecklist(state.store, bizToday());
      state.loading = false;
      render();
    });
    app.querySelectorAll(".cal-day[data-checklistdate]").forEach(el=>{
      el.addEventListener("click", async ()=>{
        const dt = el.getAttribute("data-checklistdate");
        state.loading = true; render();
        await loadChecklist(state.store, dt);
        state.showChecklistCalendar = false;
        state.loading = false;
        render();
      });
    });
  }

  function bindSalesSectionEvents(){
    app.querySelectorAll("[data-salestab]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.salesSectionTab = btn.getAttribute("data-salestab"); render(); });
    });
    const prevM = document.getElementById("prev-month");
    const nextM = document.getElementById("next-month");
    if(prevM) prevM.addEventListener("click", ()=>changeMonth(-1));
    if(nextM) nextM.addEventListener("click", ()=>changeMonth(1));
    app.querySelectorAll(".cal-day[data-salesdate]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const dt = el.getAttribute("data-salesdate");
        state.selectedSalesDate = (state.selectedSalesDate===dt) ? null : dt;
        state.showExpenseSection = false;
        render();
      });
    });
    app.querySelectorAll("[data-openownersales]").forEach(btn=>{
      btn.addEventListener("click", ()=> openOwnerSalesForm(btn.getAttribute("data-openownersales")));
    });
    const toggleExpenseBtn = document.getElementById("toggle-expense-section-btn");
    if(toggleExpenseBtn) toggleExpenseBtn.addEventListener("click", ()=>{ state.showExpenseSection = !state.showExpenseSection; render(); });
    app.querySelectorAll("[data-delexpense]").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteExpenseEntry(btn.getAttribute("data-delexpense")));
    });
    const toggleVendorManageBtn = document.getElementById("toggle-vendor-manage-btn");
    if(toggleVendorManageBtn) toggleVendorManageBtn.addEventListener("click", ()=>{ state.showVendorManage = !state.showVendorManage; render(); });
    const exportExpenseExcelBtn = document.getElementById("export-expense-excel-btn");
    if(exportExpenseExcelBtn) exportExpenseExcelBtn.addEventListener("click", exportExcelExpenses);
    const exportMonthlyReportBtn = document.getElementById("export-monthly-report-excel-btn");
    if(exportMonthlyReportBtn) exportMonthlyReportBtn.addEventListener("click", exportExcelMonthlyReport);
    const toggleFixedExpenseBtn = document.getElementById("toggle-fixedexpense-manage-btn");
    if(toggleFixedExpenseBtn) toggleFixedExpenseBtn.addEventListener("click", ()=>{ state.showFixedExpenseManage = !state.showFixedExpenseManage; render(); });
    const addFixedExpenseBtn = document.getElementById("add-fixedexpense-btn");
    if(addFixedExpenseBtn) addFixedExpenseBtn.addEventListener("click", addFixedExpense);
    app.querySelectorAll("[data-delfixedexpense]").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteFixedExpense(btn.getAttribute("data-delfixedexpense")));
    });
    app.querySelectorAll("[data-fixedexpense-amount]").forEach(inp=>{
      inp.addEventListener("change", ()=> updateFixedExpenseAmount(inp.getAttribute("data-fixedexpense-amount"), inp.value));
    });
    const addVendorBtn = document.getElementById("add-vendor-btn");
    if(addVendorBtn) addVendorBtn.addEventListener("click", addVendor);
    app.querySelectorAll("[data-delvendor]").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteVendor(btn.getAttribute("data-delvendor")));
    });
    const paySel = document.getElementById("pay-crew-select");
    if(paySel) paySel.addEventListener("change", ()=>{ state.payCrewId = paySel.value; render(); });
    const exportBtn = document.getElementById("export-excel-btn");
    if(exportBtn) exportBtn.addEventListener("click", exportExcelAttendance);
  }

  function bindOwnerEvents(){
    if(state.showOwnerSalesForm) bindSalesReportEvents();
    app.querySelectorAll(".store-tab[data-store]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const s = btn.getAttribute("data-store");
        if(s !== state.store){ state.store = s; state.selectedDate=null; state.selectedSalesDate=null; state.showFixedPanel=false; state.showStoreManage=false; state.showAnnounceForm=false; loadAllForStore(s); }
      });
    });
    app.querySelectorAll(".store-tab[data-ownerstore]").forEach(btn=>{
      btn.addEventListener("click", ()=> switchOwnerStore(btn.getAttribute("data-ownerstore")));
    });
    const addStoreRequestBtn = document.getElementById("add-store-request-btn");
    if(addStoreRequestBtn) addStoreRequestBtn.addEventListener("click", ()=>{
      state.showAddStoreForm = !state.showAddStoreForm;
      render();
    });
    const closeAddStoreBtn = document.getElementById("close-add-store-btn");
    if(closeAddStoreBtn) closeAddStoreBtn.addEventListener("click", closeAddStoreForm);
    const submitAddStoreBtn = document.getElementById("submit-add-store-btn");
    if(submitAddStoreBtn) submitAddStoreBtn.addEventListener("click", submitAdditionalStoreRequest);
    const manageStoreBtn = document.getElementById("manage-store-btn");
    if(manageStoreBtn) manageStoreBtn.addEventListener("click", async ()=>{
      state.showStoreManage = !state.showStoreManage;
      if(state.showStoreManage) await loadOwnerRequests();
      render();
    });
    const closeStoreManageBtn = document.getElementById("close-store-manage-btn");
    if(closeStoreManageBtn) closeStoreManageBtn.addEventListener("click", ()=>{ state.showStoreManage = false; render(); });
    const dashboardViewAllBtn = document.getElementById("dashboard-view-all-btn");
    if(dashboardViewAllBtn) dashboardViewAllBtn.addEventListener("click", ()=>{ state.showStoreManage = false; render(); });
    const changePinBtn = document.getElementById("change-pin-btn");
    if(changePinBtn) changePinBtn.addEventListener("click", changeOwnerPin);
    app.querySelectorAll("[data-approvereq]").forEach(btn=>{
      btn.addEventListener("click", ()=> approveOwnerRequest(btn.getAttribute("data-approvereq")));
    });
    app.querySelectorAll("[data-rejectreq]").forEach(btn=>{
      btn.addEventListener("click", ()=> rejectOwnerRequest(btn.getAttribute("data-rejectreq")));
    });
    app.querySelectorAll("[data-revokereq]").forEach(btn=>{
      btn.addEventListener("click", ()=> revokeOwnerAccess(btn.getAttribute("data-revokereq")));
    });
    app.querySelectorAll("[data-editowner]").forEach(btn=>{
      btn.addEventListener("click", ()=> startEditOwner(btn.getAttribute("data-editowner")));
    });
    app.querySelectorAll("[data-saveowner]").forEach(btn=>{
      btn.addEventListener("click", ()=> submitEditOwner(btn.getAttribute("data-saveowner")));
    });
    app.querySelectorAll("[data-canceleditowner]").forEach(btn=>{
      btn.addEventListener("click", cancelEditOwner);
    });
    app.querySelectorAll("[data-resetpw]").forEach(btn=>{
      btn.addEventListener("click", ()=> resetOwnerPassword(btn.getAttribute("data-resetpw")));
    });
    app.querySelectorAll("[data-copypw]").forEach(btn=>{
      btn.addEventListener("click", ()=> copyCode(btn.getAttribute("data-copypw")));
    });
    const closeRevealedPwBtn = document.getElementById("close-revealed-pw-btn");
    if(closeRevealedPwBtn) closeRevealedPwBtn.addEventListener("click", closeRevealedPassword);
    const addStoreBtn = document.getElementById("add-store-btn");
    if(addStoreBtn) addStoreBtn.addEventListener("click", addStore);
    app.querySelectorAll("[data-delstore]").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteStore(btn.getAttribute("data-delstore")));
    });
    app.querySelectorAll("[data-renamestore]").forEach(btn=>{
      btn.addEventListener("click", ()=> startRenameStore(btn.getAttribute("data-renamestore")));
    });
    app.querySelectorAll("[data-setloc]").forEach(btn=>{
      btn.addEventListener("click", ()=> setStoreLocation(btn.getAttribute("data-setloc")));
    });
    app.querySelectorAll("[data-renamesave]").forEach(btn=>{
      btn.addEventListener("click", ()=> submitRenameStore(btn.getAttribute("data-renamesave")));
    });
    app.querySelectorAll("[data-renamecancel]").forEach(btn=>{
      btn.addEventListener("click", cancelRenameStore);
    });
    app.querySelectorAll("[data-section]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const sec = btn.getAttribute("data-section");
        state.section = sec;
        if(sec === "dashboard" && !state.dashboardData){
          loadDashboardData();
        }else{
          render();
        }
      });
    });
    const refreshDashboardBtn = document.getElementById("refresh-dashboard-btn");
    if(refreshDashboardBtn) refreshDashboardBtn.addEventListener("click", loadDashboardData);
    const askAppBtn = document.getElementById("ask-app-btn");
    if(askAppBtn) askAppBtn.addEventListener("click", askApp);
    const askAppMicBtn = document.getElementById("ask-app-mic-btn");
    if(askAppMicBtn) askAppMicBtn.addEventListener("click", startVoiceInput);
    const askAppClearBtn = document.getElementById("ask-app-clear-btn");
    if(askAppClearBtn) askAppClearBtn.addEventListener("click", clearAskAppChat);
    const askAppConfirmBtn = document.getElementById("ask-app-confirm-btn");
    if(askAppConfirmBtn) askAppConfirmBtn.addEventListener("click", confirmPendingAction);
    const askAppCancelBtn = document.getElementById("ask-app-cancel-btn");
    if(askAppCancelBtn) askAppCancelBtn.addEventListener("click", cancelPendingAction);
    const taxReminderAckBtn = document.getElementById("tax-reminder-ack-btn");
    if(taxReminderAckBtn) taxReminderAckBtn.addEventListener("click", ackTaxReminder);
    const toggleAnnFormBtnOwner = document.getElementById("toggle-ann-form-btn");
    if(toggleAnnFormBtnOwner) toggleAnnFormBtnOwner.addEventListener("click", ()=>{ state.showAnnounceForm = !state.showAnnounceForm; render(); });
    const submitAnnBtnOwner = document.getElementById("submit-ann-btn");
    if(submitAnnBtnOwner) submitAnnBtnOwner.addEventListener("click", createAnnouncement);
    app.querySelectorAll("[data-delann]").forEach(btn=>{
      btn.addEventListener("click", ()=> deleteAnnouncement(btn.getAttribute("data-delann")));
    });
    bindChecklistEvents();
    app.querySelectorAll("[data-stab]").forEach(btn=>{
      btn.addEventListener("click", ()=>{ state.scheduleTab = btn.getAttribute("data-stab"); render(); });
    });
    bindSalesSectionEvents();
    bindScheduleEditEvents();
    bindCrewManageEvents();
    const switchBtn = document.getElementById("switch-user-btn");
    if(switchBtn) switchBtn.addEventListener("click", switchUser);
  }

  resolveIdentity();

  // PWA 서비스워커 등록 (지원 안 되는 환경이면 조용히 무시)
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("/sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
