<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>StoreManager</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="theme-color" content="#3D6EF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StoreManager">
<style>
  :root{
    --cream:#F7F8FA;
    --card:#FFFFFF;
    --ink:#17181C;
    --ink-soft:#8A8F98;
    --brick:#3D6EF0;
    --brick-dim:#DCE6FD;
    --olive:#22B457;
    --olive-dim:#DDF5E6;
    --danger:#E5484D;
    --danger-dim:#FDE2E1;
    --gold:#D99A4E;
    --line:#E7E9EE;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .app{ width:100%; max-width:480px; min-height:100vh; background:var(--cream); display:flex; flex-direction:column; }
  .app.has-bottom-nav main{ padding-bottom:88px; }

  .bottom-nav{ position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:var(--card); border-top:1px solid var(--line); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); z-index:40; }
  .bottom-nav button{ flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; padding:7px 2px 5px; cursor:pointer; color:var(--ink-soft); font-size:10.5px; font-weight:600; }
  .bottom-nav button svg{ width:22px; height:22px; }
  .bottom-nav button.active{ color:var(--brick); }

  header{ padding:22px 20px 14px; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:baseline; gap:8px; margin-bottom:16px; }
  .brand .mark{ width:24px;height:24px;border-radius:8px; background:#fff; border:1px solid var(--line); flex:none; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .brand .mark svg{ width:14px;height:14px; }
  .brand h1{ font-size:19px; font-weight:800; letter-spacing:-0.02em; margin:0; }
  .brand .date{ margin-left:auto; font-size:13px; color:var(--ink-soft); }

  .store-tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; }
  .store-tab{ flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-size:13.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap; }
  .store-tab.active{ background:var(--ink); border-color:var(--ink); color:var(--cream); }

  .section-nav{ display:flex; gap:0; border-top:1px solid var(--line); margin-top:2px; }
  .section-nav button{ flex:1; border:none; background:transparent; padding:12px 4px 12px; font-size:14px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; }
  .section-nav button.active{ color:var(--ink); border-bottom-color:var(--brick); }

  main{ flex:1; padding:14px 20px 40px; }

  /* ---------- landing ---------- */
  .landing{ padding:60px 24px; text-align:center; }
  .app-logo{ width:56px; height:56px; border-radius:16px; background:var(--brick); margin:0 auto 18px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(181,64,46,0.25); }
  .app-logo svg{ width:28px; height:28px; }
  .logo-lockup{ display:inline-flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 18px 6px 6px; box-shadow:0 2px 10px rgba(23,24,28,0.06); }
  .logo-lockup .logo-symbol{ width:34px; height:34px; border-radius:10px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden; }
  .logo-lockup .logo-symbol svg{ width:19px; height:19px; }
  .logo-lockup .logo-text{ font-size:15.5px; font-weight:800; color:var(--ink); letter-spacing:-0.01em; }
  .hero-brand{ display:flex; flex-direction:column; align-items:center; margin-bottom:14px; }
  .hero-symbol{ width:88px; height:88px; border-radius:24px; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; overflow:hidden; box-shadow:0 10px 24px rgba(23,24,28,0.12); margin-bottom:18px; }
  .hero-symbol svg{ width:48px; height:48px; }
  .hero-wordmark{ font-size:30px; font-weight:800; letter-spacing:-0.03em; }
  .hero-wordmark .wm-a{ color:var(--ink); }
  .hero-wordmark .wm-b{ color:var(--brick); }
  .landing h1{ font-size:22px; font-weight:800; margin:0 0 8px; letter-spacing:-0.02em; }
  .landing p{ font-size:14px; color:var(--ink-soft); margin:0 0 36px; line-height:1.5; }
  .landing-btn{ width:100%; border:none; border-radius:999px; padding:16px; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:10px; }
  .landing-btn.primary{ background:var(--ink); color:var(--cream); }
  .landing-btn.secondary{ background:var(--card); color:var(--ink); border:1px solid var(--line); }
  .code-box{ margin-top:18px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; text-align:left; }
  .code-box label{ font-size:12.5px; color:var(--ink-soft); font-weight:600; display:block; margin-bottom:8px; }
  .code-box input{ width:100%; border:1px solid var(--line); background:var(--cream); border-radius:10px; padding:12px; font-size:18px; letter-spacing:0.2em; text-align:center; font-weight:800; color:var(--ink); margin-bottom:10px; }
  .code-box button{ width:100%; border:none; background:var(--brick); color:#fff; border-radius:10px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; }

  /* ---------- staff home ---------- */
  .staff-hero{ padding:6px 0 20px; }
  .staff-hero .greet{ font-size:20px; font-weight:800; letter-spacing:-0.01em; margin:0 0 4px; }
  .staff-hero .sub{ font-size:13px; color:var(--ink-soft); margin:0; }
  .s-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:14px; }
  .s-card .s-label{ font-size:12.5px; color:var(--ink-soft); font-weight:700; margin:0 0 8px; }
  .icon-badge{ width:26px; height:26px; border-radius:50%; background:var(--brick); color:#fff; display:flex; align-items:center; justify-content:center; flex:none; }
  .icon-badge svg{ width:14px; height:14px; }
  .s-card .s-main{ font-size:17px; font-weight:800; margin:0; }
  .s-card .s-note{ font-size:12.5px; color:var(--ink-soft); margin:6px 0 0; }
  .clock-btn{ width:100%; border:none; border-radius:999px; padding:20px; font-size:17px; font-weight:800; cursor:pointer; margin-top:12px; }
  .clock-btn.in{ background:var(--ink); color:#fff; }
  .clock-btn.out{ background:var(--ink); color:#fff; }
  .attend-status{ font-size:13.5px; color:var(--ink-soft); }
  .month-pill{ background:var(--brick); color:#fff; border-radius:16px; padding:18px 20px; margin-bottom:14px; }
  .month-pill .mp-label{ font-size:12px; opacity:.7; margin:0 0 6px; }
  .month-pill .mp-row{ display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:4px; }
  .month-pill .mp-row b{ font-size:15px; }
  .staff-nav{ display:flex; gap:8px; margin-top:6px; }
  .staff-nav button{ flex:1; border:1px solid var(--line); background:var(--card); border-radius:12px; padding:13px; font-size:13.5px; font-weight:700; color:var(--ink); cursor:pointer; }
  .staff-back{ border:none; background:transparent; color:var(--ink-soft); font-size:13px; font-weight:600; cursor:pointer; padding:0 0 14px; }
  .switch-link{ display:block; text-align:center; margin-top:22px; border:none; background:transparent; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; }
  .coworkers{ display:flex; gap:10px; overflow-x:auto; padding:2px 0 2px; }
  .cw-chip{ flex:none; display:flex; flex-direction:column; align-items:center; gap:6px; width:64px; }
  .cw-chip .cw-avatar{ width:42px; height:42px; border-radius:50%; background:var(--brick-dim); color:var(--brick); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; }
  .cw-chip .cw-name{ font-size:11.5px; font-weight:700; text-align:center; }
  .cw-chip .cw-time{ font-size:10px; color:var(--ink-soft); text-align:center; }

  /* ---------- checklist ---------- */
  .hero{ display:flex; align-items:center; gap:18px; padding:8px 0 22px; }
  .ring-wrap{ position:relative; width:78px; height:78px; flex:none; }
  .ring-wrap svg{ transform:rotate(-90deg); width:78px;height:78px; }
  .ring-bg{ fill:none; stroke:var(--brick-dim); stroke-width:8; }
  .ring-fg{ fill:none; stroke:var(--brick); stroke-width:8; stroke-linecap:round; transition:stroke-dasharray .5s ease; }
  .ring-pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:800; }
  .hero-text .lead{ font-size:14px; color:var(--ink-soft); margin:0 0 4px; }
  .hero-text .big{ font-size:20px; font-weight:800; margin:0; letter-spacing:-0.01em; }
  .hero-text .big em{ font-style:normal; color:var(--brick); }

  .seg{ display:flex; margin:0 0 14px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px; }
  .seg button{ flex:1; border:none; background:transparent; padding:10px 6px; border-radius:9px; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .seg button.active{ background:var(--ink); color:var(--cream); }
  .seg button .count{ font-size:11px; font-weight:500; opacity:.7; }

  .category{ background:var(--card); border:1px solid var(--line); border-radius:16px; margin-bottom:14px; overflow:hidden; }
  .category-head{ display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .category-head h2{ font-size:14.5px; font-weight:700; margin:0; flex:1; }
  .category-head .cat-progress{ font-size:12px; color:var(--ink-soft); font-weight:600; }

  .item-row{ display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .item-row:last-of-type{ border-bottom:none; }
  .item-row.done .item-label{ color:var(--ink-soft); text-decoration:line-through; text-decoration-color:var(--line); }
  .step-no{ font-size:11px; color:var(--ink-soft); width:14px; flex:none; text-align:center; font-weight:600; }
  .checkbox{ width:24px;height:24px; border-radius:7px; border:2px solid var(--line); flex:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:var(--card); transition:background .15s ease, border-color .15s ease, transform .1s ease; }
  .checkbox:active{ transform:scale(.9); }
  .checkbox.checked{ background:var(--olive); border-color:var(--olive); }
  .checkbox svg{ width:14px;height:14px; opacity:0; transform:scale(.5); transition:opacity .15s ease, transform .15s ease; }
  .checkbox.checked svg{ opacity:1; transform:scale(1); }
  .item-label{ flex:1; font-size:14.5px; line-height:1.4; }
  .item-del{ border:none; background:none; color:var(--ink-soft); font-size:11.5px; text-decoration:underline; cursor:pointer; flex:none; padding:2px; }

  .add-row{ display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; background:#F2F4F8; }
  .add-row input, .add-row select{ min-width:0; }
  .add-row input{ flex:1; border:1px solid var(--line); background:var(--card); border-radius:9px; padding:9px 12px; font-size:13.5px; font-family:inherit; color:var(--ink); }
  .add-row input:focus{ outline:2px solid var(--gold); outline-offset:1px; }
  .add-row button{ border:none; background:var(--ink); color:var(--cream); border-radius:9px; padding:0 16px; font-size:13px; font-weight:700; cursor:pointer; }

  .empty-note{ padding:24px 16px; text-align:center; color:var(--ink-soft); font-size:13.5px; }
  .reset-bar{ display:flex; justify-content:center; padding:6px 0 18px; }
  .reset-bar button{ border:none; background:transparent; color:var(--ink-soft); font-size:12.5px; text-decoration:underline; cursor:pointer; }

  /* ---------- schedule / crew / pay ---------- */
  .subnav{ display:flex; gap:0; margin-bottom:16px; border-bottom:1px solid var(--line); }
  .subnav button{ flex:1; border:none; background:transparent; padding:0 0 10px; font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .subnav button.active{ color:var(--ink); border-bottom-color:var(--gold); }

  .month-nav{ display:flex; align-items:center; justify-content:center; gap:18px; margin-bottom:14px; }
  .month-nav button{ border:1px solid var(--line); background:var(--card); width:32px; height:32px; border-radius:50%; font-size:14px; cursor:pointer; color:var(--ink); }
  .month-nav .month-label{ font-size:15.5px; font-weight:800; letter-spacing:-0.01em; min-width:88px; text-align:center; }

  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:16px; }
  .cal-dow{ text-align:center; font-size:11px; color:var(--ink-soft); font-weight:700; padding-bottom:4px; }
  .cal-day{ aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:var(--card); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; font-size:13px; font-weight:700; color:var(--ink); position:relative; }
  .cal-day.empty{ visibility:hidden; cursor:default; }
  .cal-day.today{ border-color:var(--brick); }
  .cal-day.selected{ background:var(--ink); color:var(--cream); border-color:var(--ink); }
  .cal-day .dot{ width:5px; height:5px; border-radius:50%; background:var(--gold); }
  .cal-day .dot.dot-done{ background:var(--olive); }
  .cal-day.selected .dot{ background:var(--cream); }

  .day-panel{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:16px; }
  .day-panel h3{ font-size:14.5px; margin:0 0 12px; font-weight:800; }
  .shift-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line); }
  .shift-row:last-of-type{ border-bottom:none; }
  .shift-name{ font-weight:700; font-size:13.5px; flex:1; }
  .shift-time{ font-size:12.5px; color:var(--ink-soft); }
  .shift-del{ border:none; background:transparent; color:var(--ink-soft); font-size:12px; cursor:pointer; text-decoration:underline; }

  .shift-form{ display:flex; flex-direction:column; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .shift-form label{ font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:-4px; }
  .shift-form select, .shift-form input{ border:1px solid var(--line); background:var(--cream); border-radius:9px; padding:9px 12px; font-size:13.5px; font-family:inherit; color:var(--ink); }
  .shift-form .row2{ display:flex; gap:8px; }
  .shift-form .row2 > div{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .shift-form button{ border:none; background:var(--brick); color:#fff; border-radius:9px; padding:10px; font-size:13.5px; font-weight:700; cursor:pointer; margin-top:4px; }
  .day-chips{ display:flex; gap:6px; flex-wrap:wrap; }
  .time-select-row{ display:flex; gap:6px; }
  .shift-form .time-select-row select{
    flex:1; min-width:0; border:1px solid var(--line); background:var(--cream); border-radius:9px;
    padding:9px 22px 9px 8px; font-size:13.5px; font-weight:700; font-family:inherit; color:var(--ink);
    appearance:none; -webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><path d='M6 9L12 15L18 9' stroke='%238A8F98' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat; background-position:right 4px center; background-size:14px;
  }
  .shift-form .day-chip{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:8px 11px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; margin-top:0; }
  .shift-form .day-chip.active{ background:var(--brick); border-color:var(--brick); color:#fff; }
  .fixed-pattern-row{ display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; flex-wrap:wrap; }
  .fixed-pattern-row:last-of-type{ border-bottom:none; }
  .fixed-pattern-row .fp-info{ flex:1; min-width:0; }
  .fixed-pattern-row input{ min-width:0; }
  .fixed-pattern-row .fp-name{ font-weight:700; font-size:13.5px; }
  .fixed-pattern-row .fp-detail{ color:var(--ink-soft); font-size:12px; margin-top:2px; }

  .crew-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .crew-card .crew-top{ display:flex; align-items:center; gap:12px; }
  .crew-avatar{ width:38px; height:38px; border-radius:50%; background:var(--olive-dim); color:var(--olive); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex:none; }
  .crew-info{ flex:1; }
  .crew-info .name{ font-weight:700; font-size:14.5px; display:flex; align-items:center; gap:6px; }
  .pos-badge{ font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px; background:var(--gold); color:#fff; }
  .pos-badge.pos-kitchen{ background:var(--brick); }
  .pos-badge.pos-etc{ background:var(--ink-soft); }
  .pos-badge.mgr-badge{ background:var(--ink); }
  .pos-badge.owner-badge{ background:var(--brick); }
  .pos-badge.staff-badge{ background:var(--olive); }
  .crew-info .wage{ font-size:12.5px; color:var(--ink-soft); }
  .crew-group-label{ font-size:12.5px; font-weight:800; color:var(--ink-soft); margin:14px 0 8px; }
  .crew-group-label:first-child{ margin-top:0; }
  .crew-del{ border:none; background:transparent; color:var(--ink-soft); font-size:12px; cursor:pointer; text-decoration:underline; }
  .crew-code-row{ display:flex; align-items:center; gap:8px; margin-top:12px; padding-top:12px; border-top:1px dashed var(--line); }
  .crew-code{ font-size:16px; font-weight:800; letter-spacing:0.15em; background:var(--cream); border:1px solid var(--line); border-radius:8px; padding:6px 10px; flex:1; text-align:center; }
  .crew-code-btn{ border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:7px 10px; font-size:12px; font-weight:700; cursor:pointer; }
  .crew-code-hint{ font-size:11.5px; color:var(--ink-soft); margin:6px 0 0; }

  .crew-form{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:6px; display:flex; flex-direction:column; gap:12px; }
  .field-label{ display:block; font-size:11.5px; color:var(--ink-soft); font-weight:600; margin-bottom:5px; }
  .crew-form .row2, .row2{ display:flex; gap:8px; }
  .crew-form .row2 > div, .row2 > div{ flex:1; min-width:0; }
  .crew-form .row2 > div.narrow{ flex:0 0 96px; }
  .crew-form input, .crew-form select, .field-input{ width:100%; border:1px solid var(--line); background:var(--cream); border-radius:9px; padding:10px 12px; font-size:13.5px; font-family:inherit; color:var(--ink); line-height:1.3; }
  .crew-form select, select.field-input{ appearance:none; -webkit-appearance:none; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'><path d='M6 9L12 15L18 9' stroke='%238A8F98' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>"); background-repeat:no-repeat; background-position:right 10px center; background-size:16px; padding-right:32px; }
  .mgr-toggle-row{ display:flex; align-items:center; gap:9px; background:var(--cream); border-radius:10px; padding:11px 12px; }
  .mgr-toggle-row input[type="checkbox"]{ width:18px; height:18px; accent-color:var(--brick); flex:none; }
  .mgr-toggle-row label{ font-size:12.5px; color:var(--ink); line-height:1.4; }
  .payroll-flags{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .payroll-flag{ display:flex; align-items:center; gap:7px; background:var(--cream); border-radius:10px; padding:9px 8px 9px 10px; font-size:12.5px; color:var(--ink); cursor:pointer; }
  .payroll-flag input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--brick); flex:none; }
  .payroll-flag .flag-label{ flex:1; line-height:1.3; }
  .info-icon-btn{ border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-size:10px; font-style:normal; font-weight:700; cursor:pointer; width:18px; height:18px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; padding:0; }
  .toggle-pair{ display:flex; gap:8px; }
  .toggle-pair .toggle-opt{ flex:1; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:9px; padding:10px; font-size:13px; font-weight:700; cursor:pointer; }

  function haversineMeters(lat1, lng1, lat2, lng2){
    const R = 6371000;
    const toRad = d => d * Math.PI / 180;
    const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
    const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  async function resolveIdentity(){
    state.loading = true; render();
    await loadStoreList();
    try{
      const linkR = localGet("my-link");
      if(linkR && linkR.value){
        const link = JSON.parse(linkR.value);
        state.role = "staff";
        state.store = link.store;
        state.myCrewId = link.crewId;
        if(link.storeId && !state.storeIdMap[link.store]) state.storeIdMap[link.store] = link.storeId;
        await loadStaffHome(state.store, state.myCrewId);
        return;
      }
    }catch(e){}
    try{
      const reqIdR = localGet("my-request-id");
      if(reqIdR && reqIdR.value){
        const record = await findOwnerRequestById(reqIdR.value);
        if(record){
          if(record.status === "approved"){
            await ensureStoreInList(record.store);
            state.role = "storeOwner";
            state.store = record.store;
            state.myRequestId = record.id;
            state.myUsername = record.username;
            state.myStores = await computeMyStoresDb(record.username);
            await loadAllForStore(record.store);
            state.onboardingStep = (state.storeOnboardingMap && !state.storeOnboardingMap[record.store]) ? "location" : null;
            loadTaxReminderInfo().then(render);
            return;
          }
          if(record.status === "pending"){
            state.role = "landing";
            state.landingMode = "request-pending";
            state.pendingStoreForOwner = record.store;
            state.loading = false;
            render();
            return;
          }
          state.role = "landing";
          state.landingMode = "request-rejected";
          state.pendingStoreForOwner = record.store;
          state.loading = false;
          render();
          return;
        }
      }
    }catch(e){}
    try{
      const roleR = localGet("my-role");
      if(roleR && roleR.value === "hq"){
        state.role = "hq";
        await loadAllForStore(state.store);
        loadTaxReminderInfo().then(render);
        return;
      }
    }catch(e){}
    state.role = "landing";
    state.loading = false;
    render();
  }

  function hashPassword(pw){
    const enc = new TextEncoder().encode(pw);
    return crypto.subtle.digest("SHA-256", enc).then(buf=>{
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
    });
  }

  async function loadChecklist(store, dateStr){
    const d = dateStr || bizToday();
    const storeId = state.storeIdMap[store];
    let items = {};
    if(storeId){
      try{
        const { data, error } = await db.from('checklist_templates').select('tab,data').eq('store_id', storeId);
        if(error) throw error;
        (data||[]).forEach(r=>{ items[r.tab] = r.data; });
      }catch(e){}
    }
    if(!items.morning && !items.afternoon && !items.routine){
      items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      if(storeId){
        try{ await db.from('checklist_templates').upsert(Object.keys(items).map(tab=>({ store_id:storeId, tab, data: items[tab] }))); }catch(e){}
      }
    }
    let checks = {};
    if(storeId){
      try{
        const { data, error } = await db.from('checklist_checks').select('item_id').eq('store_id', storeId).eq('date', d);
        if(error) throw error;
        (data||[]).forEach(r=>{ checks[r.item_id] = true; });
      }catch(e){}
    }
    state.items = items;
    state.checks = checks;
    state.checklistViewDate = d;
  }
  async function loadChecklistLog(store, mKey){
    const storeId = state.storeIdMap[store];
    state.checklistLog = {};
    if(!storeId) return;
    try{
      const { data, error } = await db.from('checklist_log').select('date,done,total,closed_at').eq('store_id', storeId);
      if(error) throw error;
      (data||[]).forEach(r=>{
        if(r.date && r.date.indexOf(mKey)===0){
          state.checklistLog[r.date] = { done:r.done, total:r.total, closedAt: r.closed_at ? new Date(r.closed_at).getTime() : null };
        }
      });
    }catch(e){}
  }
  function closeChecklistDay(){

  function compressImage(file, maxWidth, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = function(e){
        const img = new Image();
        img.onload = function(){
          let w = img.width, h = img.height;
          if(w > maxWidth){ h = Math.round(h * maxWidth / w); w = maxWidth; }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function autoFillFromPhoto(){
    const photos = state.salesDraft.settlementPhotos || [];
    if(photos.length===0){
      showToast("먼저 정산표 사진을 추가해 주세요.");
      return;
    }
    const dataUrl = photos[photos.length-1];
    const match = dataUrl.match(/^data:(image\/[a-zA-Z]+);base64,(.+)$/);
    if(!match){ showToast("사진을 읽는 데 실패했어요."); return; }
    const mediaType = match[1];
    const base64Data = match[2];
    showToast("사진에서 숫자를 읽는 중이에요…");
    try{
      const response = await fetch("/.netlify/functions/read-receipt", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ base64Data, mediaType })
      });
      const data = await response.json();
      if(!response.ok || !data.result){
        const errMsg = data.error ? (data.error+(data.detail&&data.detail.error&&data.detail.error.message?(": "+data.detail.error.message):"")) : "숫자를 읽지 못했어요";
        showToast(errMsg+", 직접 입력해 주세요.");
        return;
      }
      const parsed = data.result;
      const fieldMap = { totalSales:"totalSales", discount:"discount", refund:"refund", cashSales:"cashSales", cardSales:"cardSales", till:"till" };
      let filledCount = 0;
      Object.keys(fieldMap).forEach(k=>{
        if(parsed[k] !== null && parsed[k] !== undefined && parsed[k] !== ""){
          state.salesDraft[fieldMap[k]] = String(parseInt(parsed[k],10)||0);
          filledCount++;
        }
      });
      recalcDerived();
      render();
      showToast(filledCount>0 ? (filledCount+"개 항목을 자동으로 채웠어요. 확인 후 수정해 주세요.") : "사진에서 읽을 수 있는 숫자가 없었어요, 직접 입력해 주세요.");
    }catch(e){
      showToast("자동입력에 실패했어요, 직접 입력해 주세요.");
    }
  }

        laborRatio: d.laborRatio, expenseSum: d.expenseSum, expenseRatio: d.expenseRatio, crewCount: d.crewCount
      }));
    }
    // 지난 3개월 요약 (월별 총매출/인건비만 가볍게)
    ctx.pastMonthsSummary = [];
    const storesForHistory = state.role==="hq" ? state.storeList : (state.myStores && state.myStores.length ? state.myStores : [state.store]);
    for(let back=1; back<=3; back++){
      let py = y, pm = m - back;
      while(pm < 1){ pm += 12; py -= 1; }
      const pKey = py+"-"+pad(pm);
      const { start, end } = monthDateRange(pKey);
      for(const store of storesForHistory){
        const storeId = state.storeIdMap[store];
        if(!storeId) continue;
        try{
          const { data } = await db.from('sales_reports').select('total_sales').eq('store_id', storeId).gte('date', start).lte('date', end);
          let sum = 0; (data||[]).forEach(r=> sum += Number(r.total_sales)||0);
          ctx.pastMonthsSummary.push({ store, month: pKey, totalSales: sum });
        }catch(e){}
      }
    }
    // 본사(관리자)나 여러 매장 사장님이면, 지금 보고 있는 매장뿐 아니라 전체 매장 직원 정보도 같이 넘겨줘요.
    if(storesForHistory.length > 1){
      ctx.allStoresCrew = [];
      for(const store of storesForHistory){
        const storeId = state.storeIdMap[store];
        if(!storeId) continue;
        try{
          const { data } = await db.from('crew').select('*').eq('store_id', storeId);
          (data||[]).map(rowToCrew).forEach(c=>{
            const info = calcCrewPay(c, y, m);
            ctx.allStoresCrew.push({ store, name: c.name, position: c.position, wageType: c.wageType, wage: c.wage, hoursThisMonth: Number(info.hours.toFixed(1)), daysThisMonth: info.days, estimatedPay: info.pay });
          });
        }catch(e){}
      }
    }
    return ctx;
  }
  function startVoiceInput(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!SR){ showToast("이 브라우저에서는 음성 입력을 지원하지 않아요."); return; }
    const recognizer = new SR();
    recognizer.lang = "ko-KR";
    recognizer.interimResults = false;
    recognizer.maxAlternatives = 1;
    const micBtn = document.getElementById("ask-app-mic-btn");
    if(micBtn) micBtn.textContent = "🔴";
    recognizer.onresult = (e)=>{
      const text = e.results[0][0].transcript;
      const input = document.getElementById("ask-app-input");
      if(input) input.value = text;
    };
    recognizer.onerror = ()=>{ showToast("음성을 인식하지 못했어요, 다시 시도해 주세요."); };
    recognizer.onend = ()=>{ if(micBtn) micBtn.textContent = "🎤"; };
    recognizer.start();
  }
  async function askApp(){
    const input = document.getElementById("ask-app-input");
    const question = (input.value||"").trim();
    if(!question){ showToast("질문을 입력해 주세요."); return; }
    if(!state.askAppMessages) state.askAppMessages = [];
    state.askAppMessages.push({ role:"user", content: question });
    state.askAppLoading = true;
    state.askAppPendingAction = null;
    input.value = "";
    render();
    try{
      const context = await buildAppContext();
      const response = await fetch("/.netlify/functions/ask-app", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: state.askAppMessages, context })
      });
      const data = await response.json();
      if(!response.ok || !data.result){
        state.askAppMessages.push({ role:"assistant", content: '{"type":"answer","text":"답변을 가져오지 못했어요, 다시 시도해 주세요."}' });
      }else{
        state.askAppMessages.push({ role:"assistant", content: JSON.stringify(data.result) });
        if(data.result.type === "action"){
          state.askAppPendingAction = data.result;
        }
      }
    }catch(e){
      state.askAppMessages.push({ role:"assistant", content: '{"type":"answer","text":"답변을 가져오지 못했어요, 다시 시도해 주세요."}' });
    }
    state.askAppLoading = false;
    render();
  }

  async function confirmPendingAction(){
    const action = state.askAppPendingAction;
    if(!action) return;
    const storeId = currentStoreId();
    try{
      if(action.actionType === "add_shift"){
        const crew = state.crew.find(c=> c.name === action.params.crewName);
        if(!crew){ showToast("해당 스텝을 찾지 못했어요."); state.askAppPendingAction = null; render(); return; }
        const { data, error } = await db.from('shifts').insert({ store_id: storeId, crew_id: crew.id, date: action.params.date, start_time: action.params.startTime, end_time: action.params.endTime }).select().single();
        if(error) throw error;
        state.shifts.push({ id:data.id, crewId: crew.id, date: action.params.date, start: action.params.startTime, end: action.params.endTime });
        showToast("스케줄을 등록했어요.");
      }else if(action.actionType === "add_announcement"){
        const authorName = state.role==="hq" ? "본사 관리자" : (state.store+" 사장님");
        const { data, error } = await db.from('announcements').insert({ store_id: storeId, title: action.params.title, body: action.params.body||"", author_name: authorName }).select().single();

  async function submitSalesReport(){
    const person = state.crew.find(c=>c.id===state.myCrewId);
    let managerName = person ? person.name : "";
    if(!managerName){
      if(state.role === "storeOwner") managerName = state.store+" 사장님";
      else if(state.role === "hq") managerName = "본사 관리자";
    }
    const d = state.salesDraft;
    const num = v => parseInt(String(v||"0").replace(/[^0-9-]/g,""),10) || 0;
    const dateStr = state.salesEditDate || bizToday();
    const wasEditing = !!state.salesEditingId;
    const storeId = currentStoreId();
    const cashExpenseTotal = sumCashExpenseItems(d.cashExpenseItems);

    const leftSide = num(d.totalSales);
    const rightSide = num(d.cardSales) + num(d.cashSales) + num(d.emoneySales) + num(d.discount) + cashExpenseTotal;
    if(leftSide !== rightSide){
      const diff = leftSide - rightSide;
      showToast("총매출이 안 맞아요. 카드매출+현금매출+전자화폐+할인+현금지출 합계보다 "+(diff>0?(diff.toLocaleString()+"원 많아요"):((-diff).toLocaleString()+"원 적어요"))+".");
      return;
    }

    const payload = {
      store_id: storeId, date: dateStr,
      manager_name: managerName, crew_id: state.myCrewId || null,
      total_sales: num(d.totalSales), discount: num(d.discount), refund: num(d.refund), refund_reason: (d.refundReason||"").trim(),
      net_sales: num(d.netSales), cash_sales: num(d.cashSales), expense: cashExpenseTotal, cash_expense_items: (d.cashExpenseItems||[]), actual_cash: num(d.actualCash),
      card_sales: num(d.cardSales), emoney_sales: num(d.emoneySales), card_expense: sumCashExpenseItems(d.cardExpenseItems), card_expense_items: (d.cardExpenseItems||[]),
      bank_transfer: sumCashExpenseItems(d.bankTransferItems), bank_transfer_items: (d.bankTransferItems||[]), till: num(d.till),
      delivery_baemin: num(d.deliveryBaemin), delivery_coupang: num(d.deliveryCoupang), delivery_yogiyo: num(d.deliveryYogiyo),
      note: (d.note||"").trim(),
      settlement_photos: d.settlementPhotos.slice(),
      receipt_photos: d.receiptPhotos.slice(),
      note_photos: (d.notePhotos||[]).slice(),
      submitted_at: new Date().toISOString()
    };
    try{
      const { data, error } = await db.from('sales_reports').upsert(payload, { onConflict:'store_id,date' }).select().single();
      if(error) throw error;
      const obj = rowToSalesReport(data);
      const idx = state.salesReports.findIndex(r=>r.date===dateStr);
      if(idx>=0) state.salesReports[idx] = obj; else state.salesReports.push(obj);
    }catch(e){ showToast("매출보고 저장에 실패했어요. 사진 용량이 너무 클 수 있어요."); return; }
    state.salesDraft = freshSalesDraft();
    state.salesEditingId = null;
    state.salesEditDate = null;
    state.staffView = "salesCalendar";
    state.showOwnerSalesForm = false;
    render();
    const dParts = dateStr.split("-").map(Number);
    const isLastDay = dParts[2] === daysInMonth(dParts[0], dParts[1]);
    if(!wasEditing && isLastDay){
      showToast("매출보고를 제출했어요 · 이번 달 월말 리포트가 준비됐어요! (매출 탭 → 월말리포트)");
    }else{
      showToast(wasEditing ? "매출보고를 수정했어요" : "매출보고를 제출했어요 · 오늘 체크리스트도 자동으로 마감했어요");
    }
    autoCloseChecklistForDate(state.store, dateStr);
  }

  async function autoCloseChecklistForDate(store, dateStr){
    const storeId = state.storeIdMap[store];
    if(!storeId) return;
    try{
      const { data: existing } = await db.from('checklist_log').select('date').eq('store_id', storeId).eq('date', dateStr).maybeSingle();
      if(existing) return;
      const { data: tmplData } = await db.from('checklist_templates').select('tab,data').eq('store_id', storeId);
      const items = {};
      (tmplData||[]).forEach(r=>{ items[r.tab] = r.data; });
      const { data: checksData } = await db.from('checklist_checks').select('item_id').eq('store_id', storeId).eq('date', dateStr);
      const checkedSet = new Set((checksData||[]).map(r=>r.item_id));
      let total=0, done=0;
      Object.keys(items).forEach(tabId=>{
        (items[tabId]||[]).forEach(cat=> (cat.items||[]).forEach(it=>{ total++; if(checkedSet.has(it.id)) done++; }));
      });
      const closedAt = new Date().toISOString();
      await db.from('checklist_log').upsert({ store_id: storeId, date: dateStr, done, total, closed_at: closedAt });
      if(state.store === store && state.checklistLog){
        state.checklistLog[dateStr] = { done, total, closedAt: new Date(closedAt).getTime() };
        render();
      }
    }catch(e){}
  }

  }
  function renderLogoLockup(){
    return '<div class="logo-lockup"><div class="logo-symbol">'+mascotSymbolSvg()+'</div><span class="logo-text">StoreManager</span></div>';
  }
  function renderLandingHero(){
    let html = '<div class="hero-brand">';
    html += '<div class="hero-symbol">'+mascotSymbolSvg()+'</div>';
    html += '<div class="hero-wordmark"><span class="wm-a">Store</span><span class="wm-b">Manager</span></div>';
    html += '</div>';

  }

  function roleKeyFor(c){
    if(!c) return "other";
    if(c.isManager) return "manager";
    if(c.position === "주방") return "chef";
    if(c.position === "그 외") return "other";
    return "hall";
  }

  // ---------- schedule / attendance logic ----------
  function daysInMonth(y,m){ return new Date(y, m, 0).getDate(); }
  function timeSelectHtml(idPrefix, valueHHMM){
    const parts = (valueHHMM||"10:00").split(":");
    const hh = parseInt(parts[0],10)||10, mm = parseInt(parts[1],10)||0;
    let hour12 = hh % 12; if(hour12===0) hour12 = 12;
    const ampm = hh < 12 ? "오전" : "오후";
    const roundedMin = [0,5,10,15,20,25,30,35,40,45,50,55].reduce((a,b)=> Math.abs(b-mm)<Math.abs(a-mm)?b:a, 0);
    let html = '<div class="time-select-row">';
    html += '<select id="'+idPrefix+'-ampm" class="field-input">';
    ["오전","오후"].forEach(v=> html += '<option value="'+v+'"'+(v===ampm?' selected':'')+'>'+v+'</option>');
    html += '</select>';
    html += '<select id="'+idPrefix+'-hour" class="field-input">';
    for(let h=1;h<=12;h++) html += '<option value="'+h+'"'+(h===hour12?' selected':'')+'>'+h+'시</option>';
    html += '</select>';
    html += '<select id="'+idPrefix+'-min" class="field-input">';

  function hoursBetween(startStr, endStr){
    const [sh,sm] = startStr.split(":").map(Number);
    const [eh,em] = endStr.split(":").map(Number);
    let mins = (eh*60+em) - (sh*60+sm);
    if(mins < 0) mins += 24*60;
    return mins/60;
  }

  function getTaxRate(c){
    if(c.insurance4) return 0.097;
    if(c.insurance2) return 0.009;
    if(c.tax33) return 0.033;
    return 0;
  }
  function getTaxLabel(c){
    if(c.insurance4) return "4대보험 9.7%";
    if(c.insurance2) return "2대보험 0.9%";
    if(c.tax33) return "3.3%";
    return null;
  }
  function computeNetPay(c, grossPay){
    const rate = getTaxRate(c);
    const taxAmount = Math.round(grossPay * rate);
    return { taxRate: rate, taxLabel: getTaxLabel(c), taxAmount, netPay: grossPay - taxAmount };
  }

  function calcCrewPay(c, y, m){
    return calcCrewPayFrom(c, state.attendance, y, m);
  }

  function calcCrewPayFrom(c, attArr, y, m){
    const confirmedAtt = attArr.filter(a=>a.crewId===c.id && a.checkOut && a.confirmed);
    let hours = 0;
    const daysSet = new Set();
    confirmedAtt.forEach(a=>{ hours += hoursBetween(a.checkIn, a.checkOut); daysSet.add(a.date); });
    let days = daysSet.size;
    let pay;
    if(c.wageType === "monthly"){
      const totalDaysInMonth = daysInMonth(y, m);
      const monthStart = new Date(y, m-1, 1);
      let monthEnd = new Date(y, m-1, totalDaysInMonth);
      // 지금 보고 있는 달이 "진행 중인 이번 달"이면, 아직 안 지난 날짜는 급여도 아직 안 쌓인 걸로 보고 오늘까지만 누적 계산해요.
      const isCurrentMonth = (y === now.getFullYear() && m === now.getMonth()+1);
      if(isCurrentMonth){
        const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        if(todayDate < monthEnd) monthEnd = todayDate;
      }
      let empStart = c.hireDate ? new Date(c.hireDate) : monthStart;
      let empEnd = c.resignDate ? new Date(c.resignDate) : monthEnd;
      if(empStart < monthStart) empStart = monthStart;
      if(empEnd > monthEnd) empEnd = monthEnd;
      let employedDays = 0;
      if(empEnd >= empStart){
        employedDays = Math.round((empEnd - empStart) / 86400000) + 1;
      }
      days = employedDays;
      const dailyRate = (c.wage||0) / totalDaysInMonth;
      pay = Math.round(dailyRate * employedDays);
    }else{
      pay = Math.round(hours * (c.wage||0));
    }
    if(c.probation) pay = Math.round(pay * 0.9);
    return { hours, days, pay };
  }

  async function loadDashboardData(){

      try{

          const { data } = await db.from('crew').select('*').eq('store_id', storeId);

        }
      }catch(e){}

          const { data } = await db.from('attendance').select('*').eq('store_id', storeId).gte('date', start).lte('date', end);

        }
      }catch(e){}
      try{
        if(storeId){
          const { start, end } = monthDateRange(mKey);
          const { data } = await db.from('sales_reports').select('date,total_sales,delivery_baemin,delivery_coupang,delivery_yogiyo').eq('store_id', storeId).gte('date', start).lte('date', end);
          salesArr = (data||[]).map(r=>({ date: r.date, totalSales: r.total_sales||0, deliverySum: (r.delivery_baemin||0)+(r.delivery_coupang||0)+(r.delivery_yogiyo||0) }));
        }
      }catch(e){}
      try{
        if(storeId){
          const { data } = await db.from('checklist_templates').select('tab,data').eq('store_id', storeId);
          (data||[]).forEach(r=>{ items[r.tab] = r.data; });
        }
      }catch(e){}
      try{
        if(storeId){
          const { data } = await db.from('checklist_checks').select('item_id').eq('store_id', storeId).eq('date', bizToday());
          (data||[]).forEach(r=>{ checks[r.item_id] = true; });
        }
      }catch(e){}
      let expenseArr = [];
      try{
        if(storeId){
          const { start, end } = monthDateRange(mKey);
          const { data } = await db.from('expense_entries').select('amount').eq('store_id', storeId).gte('date', start).lte('date', end);
          expenseArr = (data||[]).map(r=>({ amount: r.amount||0 }));
        }
      }catch(e){}

      let salesSum = 0;
      salesArr.forEach(s=> salesSum += Number(s.totalSales)||0);
      let deliverySum = 0;
      salesArr.forEach(s=> deliverySum += Number(s.deliverySum)||0);
      let laborPay = 0;
      crewArr.forEach(c=>{ laborPay += calcCrewPayFrom(c, attArr, y, m).pay; });
      const laborRatio = salesSum>0 ? (laborPay/salesSum*100) : null;
      let expenseSum = 0;
      expenseArr.forEach(e=> expenseSum += Number(e.amount)||0);
      const expenseRatio = salesSum>0 ? (expenseSum/salesSum*100) : null;

      let total=0, done=0;
      if(items){
        Object.keys(items).forEach(tabId=>{
          (items[tabId]||[]).forEach(cat=> (cat.items||[]).forEach(it=>{ total++; if(checks[it.id]) done++; }));
        });
      }
      const checklistPct = total>0 ? Math.round(done/total*100) : null;

      const yKey = yesterdayKey();
      const hasYesterdayReport = salesArr.some(s=> s.date===yKey);
      return { store, salesSum, deliverySum, laborPay, laborRatio, expenseSum, expenseRatio, checklistPct, crewCount: crewArr.length, hasYesterdayReport };
    }));
    results.sort((a,b)=> b.salesSum - a.salesSum);

    render();

  function styleWorksheet(ws, rows){
    if(!ws || !rows || rows.length===0) return;
    const headerFill = { fgColor: { rgb: "3D6EF0" } };
    const headerFont = { bold: true, color: { rgb: "FFFFFF" }, sz: 11 };
    const totalFont = { bold: true };
    const colCount = rows[0].length;
    const colWidths = [];
    for(let c=0;c<colCount;c++){
      let maxLen = 6;
      rows.forEach(row=>{
        const v = row[c];
        const len = v==null ? 0 : String(v).length;
        if(len>maxLen) maxLen = len;
      });
      colWidths.push({ wch: Math.min(maxLen+3, 28) });
    }
    ws['!cols'] = colWidths;
    for(let c=0;c<colCount;c++){
      const addr = XLSX.utils.encode_cell({ r:0, c });
      if(ws[addr]) ws[addr].s = { font: headerFont, fill: headerFill, alignment: { horizontal:"center", vertical:"center" } };
    }
    const lastRowIdx = rows.length-1;
    const firstCell = rows[lastRowIdx][0];
    if(firstCell === "합계"){
      for(let c=0;c<colCount;c++){
        const addr = XLSX.utils.encode_cell({ r:lastRowIdx, c });
        if(ws[addr]) ws[addr].s = { font: totalFont, border: { top: { style:"thin", color:{rgb:"CCCCCC"} } } };
      }
    }
  }

  async function applyFixedToMonth(){
    if(state.fixedSchedules.length===0){ showToast("저장된 고정 근무 패턴이 없어요."); return; }
    const y = state.monthYear, m = state.monthNum;
    const total = daysInMonth(y,m);
    const storeId = currentStoreId();
    const newRows = [];
    for(let d=1; d<=total; d++){
      const dateStr = y+"-"+pad(m)+"-"+pad(d);
      const wd = weekdayMon0(dateStr);
      state.fixedSchedules.forEach(pat=>{
        if(!pat.days.includes(wd)) return;
        const exists = state.shifts.some(s=> s.date===dateStr && s.crewId===pat.crewId);
        if(exists) return;
        newRows.push({ store_id: storeId, crew_id: pat.crewId, date: dateStr, start_time: pat.start, end_time: pat.end });
      });
    }
    if(newRows.length===0){ showToast("이미 모두 반영돼 있어요"); return; }
    try{
      const { data, error } = await db.from('shifts').insert(newRows).select();
      if(error) throw error;
      (data||[]).forEach(r=>{ state.shifts.push({ id:r.id, date:r.date, crewId:r.crew_id, start:(r.start_time||"").slice(0,5), end:(r.end_time||"").slice(0,5) }); });
      render();
      showToast(newRows.length+"개 근무를 이번 달에 추가했어요");
    }catch(e){ showToast("저장에 실패했어요."); }
  }

  function changeMonth(delta){
    let m = state.monthNum + delta;
    let y = state.monthYear;
    if(m>12){ m=1; y++; }
    if(m<1){ m=12; y--; }
    state.monthNum=m; state.monthYear=y;
    state.selectedDate = null;
    state.dashboardData = null;
    Promise.all([ loadShifts(state.store, monthKey()), loadAttendance(state.store, monthKey()), loadSalesReports(state.store, monthKey()), loadExpenseEntries(state.store, monthKey()), loadFixedExpenses(state.store, monthKey()), loadChecklistLog(state.store, monthKey()) ]).then(render);
  }

  function verifyNearStore(){
    return new Promise((resolve)=>{
      const loc = state.storeLocationMap && state.storeLocationMap[state.store];
      if(!loc){ resolve({ ok:true }); return; }
      if(!navigator.geolocation){ resolve({ ok:false, reason:"이 기기에서는 위치 확인이 안 돼서 출퇴근을 찍을 수 없어요." }); return; }
      navigator.geolocation.getCurrentPosition((pos)=>{
        const dist = haversineMeters(pos.coords.latitude, pos.coords.longitude, loc.lat, loc.lng);
        if(dist <= 100){ resolve({ ok:true }); }
        else{ resolve({ ok:false, reason:"매장에서 너무 멀어요 (약 "+Math.round(dist)+"m 떨어짐). 매장 근처에서 다시 시도해 주세요." }); }
      }, (err)=>{
        resolve({ ok:false, reason:"위치 권한이 필요해요. 위치 접근을 허용한 후 다시 시도해 주세요." });
      }, { enableHighAccuracy: true, timeout: 10000 });
    });
  }
  function findOpenAttendance(crewId){
    const open = (state.attendance||[]).filter(a=> a.crewId===crewId && a.checkIn && !a.checkOut);
    if(open.length===0) return null;
    open.sort((a,b)=> (b.date+(b.checkIn||"")).localeCompare(a.date+(a.checkIn||"")));
    return open[0];
  }

  function updateAttendanceField(attId, field, value){
    const rec = state.attendance.find(a=>a.id===attId);
    if(!rec) return;
    if(!isValidTimeStr(value)){ showToast("시간은 HH:MM 형식으로 입력해 주세요 (예: 09:30)."); render(); return; }
    const changed = rec[field] !== value;
    rec[field] = value;
    let updatePayload = {};
    const col = field === "checkIn" ? "check_in" : "check_out";
    updatePayload[col] = value;
    if(changed){
      rec.timeEdited = true;
      rec.staffAckEdit = false;
      rec.staffConfirmed = false;
      updatePayload.time_edited = true;
      updatePayload.staff_ack_edit = false;
      updatePayload.staff_confirmed = false;
    }
    render();
    (async ()=>{ try{ await db.from('attendance').update(updatePayload).eq('id', attId); }catch(e){ showToast("저장에 실패했어요."); } })();
  }

  function getExpiringHealthCerts(){
    const today = new Date(todayKey());
    return state.crew
      .filter(c=> !!c.healthCertExpiry)
      .map(c=>{
        const exp = new Date(c.healthCertExpiry);
        const daysUntil = Math.round((exp - today) / 86400000);
        return { name: c.name, expiry: c.healthCertExpiry, daysUntil };
      })
      .filter(item=> item.daysUntil <= 30)
      .sort((a,b)=> a.daysUntil - b.daysUntil);
  }
  function renderHealthCertBanner(){
    const list = getExpiringHealthCerts();
    if(list.length===0) return "";
    let html = '<div style="background:#FFF4E5;border:1px solid #FFD9A0;border-radius:12px;padding:12px 14px;margin:0 0 14px;">';

    list.forEach(item=>{
      const statusText = item.daysUntil < 0 ? (Math.abs(item.daysUntil)+'일 지남 (만료됨)') : (item.daysUntil===0 ? '오늘 만료' : ('D-'+item.daysUntil));
      html += '<div style="font-size:12.5px;color:#6B4500;padding:2px 0;">'+escapeHtml(item.name)+' · '+item.expiry+' · '+statusText+'</div>';

    html += '</div>';

  async function loadTaxReminderInfo(){
    const day = now.getDate();
    if(day < 5){ state.taxReminderInfo = null; return; }
    const curMonthKey = now.getFullYear()+"-"+pad(now.getMonth()+1);
    const storeId = currentStoreId();
    if(!storeId){ state.taxReminderInfo = null; return; }
    try{
      const { data: ackRows } = await db.from('tax_reminder_ack').select('id').eq('store_id', storeId).eq('month_key', curMonthKey);
      if(ackRows && ackRows.length>0){ state.taxReminderInfo = null; return; }
    }catch(e){}
    let curM = now.getMonth()+1, prevM = curM-1, prevY = now.getFullYear();
    if(prevM < 1){ prevM = 12; prevY -= 1; }
    const prevKey = prevY+"-"+pad(prevM);
    const { start, end } = monthDateRange(prevKey);
    let attArr = [];
    try{
      const { data } = await db.from('attendance').select('*').eq('store_id', storeId).gte('date', start).lte('date', end);
      attArr = (data||[]).map(r=>({ crewId:r.crew_id, date:r.date, checkIn:(r.check_in||"").slice(0,5), checkOut: r.check_out? r.check_out.slice(0,5): null, confirmed: !!r.confirmed }));
    }catch(e){}
    let total = 0;
    (state.crew||[]).forEach(c=>{
      const info = calcCrewPayFrom(c, attArr, prevY, prevM);
      total += info.pay;
    });
    state.taxReminderInfo = { monthKey: curMonthKey, prevMonthLabel: prevY+"년 "+prevM+"월", total, isPastDeadline: day > 10 };
  }

    const bg = info.isPastDeadline ? "var(--danger-dim)" : "#FFF4E5";

    const fg = info.isPastDeadline ? "var(--danger)" : "#8A5A00";
    let html = '<div style="background:'+bg+';border:1px solid '+border+';border-radius:12px;padding:12px 14px;margin:0 0 14px;">';
    html += '<div style="font-weight:800;font-size:13px;color:'+fg+';margin-bottom:4px;">'+(info.isPastDeadline?'⚠️ 원천세 신고 기한이 지났어요 (매달 10일)':'📋 원천세 신고 기한이 다가와요 (매달 10일까지)')+'</div>';

  function renderStaffApp(){
    const person = state.crew.find(c=>c.id===state.myCrewId);
    let html = "";
    html += '<header>';
    html += '<div class="brand"><span class="mark">'+mascotSymbolSvg()+'</span><h1><span style="color:var(--ink);">Store</span><span style="color:var(--brick);">Manager</span></h1><span class="date">'+todayLabel()+'</span></div>';
    html += '</header>';
    html += '<main>';
    if(!person){
      html += '<div class="empty-note">연결된 스텝 정보를 찾을 수 없어요. 사장님께 다시 코드를 요청해 주세요.</div>';
      html += '<button class="switch-link" id="switch-user-btn">다른 사용자로 전환</button>';
      html += '</main>';
      return html;
    }

    const mainTabs = ["home","checklist","schedule","announcements","sales"];
    if(mainTabs.includes(state.staffView)){
      if(state.staffView === "checklist") html += renderChecklist();
      else if(state.staffView === "schedule"){
        if(person.isManager){
          html += '<h3 style="margin:0 0 14px;font-size:16px;font-weight:800;">'+state.store+' 스케줄 관리</h3>';
          html += '<div class="subnav">';
          html += '<button class="'+(state.scheduleTab==="crew"?"":"active")+'" data-mgrschedtab="calendar">스케줄</button>';
          html += '<button class="'+(state.scheduleTab==="crew"?"active":"")+'" data-mgrschedtab="crew">스텝 관리</button>';
          html += '</div>';
          if(state.scheduleTab === "crew") html += renderCrewManage();
          else html += renderCalendar();
        }else{
          html += renderStaffSchedule();
        }
      }else if(state.staffView === "announcements"){
        html += renderAnnouncementsList(person);
      }else if(state.staffView === "sales"){
        html += '<h3 style="margin:0 0 14px;font-size:16px;font-weight:800;">'+state.store+' 매출</h3>';
        html += renderMissingReportBanner();
        html += renderSalesSection();
      }else{
        html += renderStaffHomeContent(person);
      }
      html += '</main>';
      html += '<nav class="bottom-nav">';
      html += '<button class="'+(state.staffView==="home"?"active":"")+'" data-staffnav="home">'+navIcon('home')+'<span>홈</span></button>';
      html += '<button class="'+(state.staffView==="checklist"?"active":"")+'" data-staffnav="checklist">'+navIcon('check')+'<span>체크</span></button>';
      html += '<button class="'+(state.staffView==="schedule"?"active":"")+'" data-staffnav="schedule">'+navIcon('calendar')+'<span>스케줄</span></button>';
      if(person.salesAccess){
        html += '<button class="'+(state.staffView==="sales"?"active":"")+'" data-staffnav="sales">'+navIcon('chart')+'<span>매출</span></button>';
      }
      const unreadCount = state.announcements.filter(a=> !(a.reads && a.reads[state.myCrewId])).length;
      html += '<button class="'+(state.staffView==="announcements"?"active":"")+'" data-staffnav="announcements">'+navIcon('bell')+'<span>공지'+(unreadCount>0?' '+unreadCount:'')+'</span></button>';
      html += '</nav>';
      return html;
    }

    if(state.staffView === "salesReport"){
      html += renderSalesReportForm();
      html += '</main>';
      return html;
    }
    if(state.staffView === "salesCalendar"){
      html += '<button class="staff-back" id="sales-cal-back-btn">‹ 홈으로</button>';
      html += renderSalesCalendar();
      html += '</main>';
      return html;
    }
    html += '</main>';
    return html;
  }

  function renderStaffHomeContent(person){
    let html = '<div class="staff-hero" style="display:flex;align-items:center;gap:12px;">'+renderAvatarBadge(person, 48)+'<div><p class="greet" style="margin:0;">'+person.name+'님, 오늘도 왔네요</p><p class="sub" style="margin:2px 0 0;display:flex;align-items:center;gap:6px;">'+state.store+(person.isManager?' <span class="pos-badge mgr-badge">매니저</span>':' <span class="pos-badge staff-badge">스텝</span>')+'</p></div></div>';

    if(person.isManager && managerDashboardEnabled(state.store)){
      const sum = computeMyStoreSummary();
      const ratioColor = sum.laborRatio===null ? "var(--ink-soft)" : (sum.laborRatio>25 ? "var(--danger)" : "var(--olive)");
      const foodColor = sum.expenseRatio===null ? "var(--ink-soft)" : (sum.expenseRatio>35 ? "var(--danger)" : "var(--olive)");
      html += '<div class="s-card">';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">'+labelWithIcon('chart','이번 달 매장 요약')+'</div>';
      html += '<p class="s-main">'+sum.salesSum.toLocaleString()+'원</p>';
      html += '<p class="crew-code-hint" style="margin-top:2px;">배달매출 '+sum.deliverySum.toLocaleString()+'원 (별도 집계)</p>';
      html += '<div style="display:flex;gap:14px;margin-top:10px;flex-wrap:wrap;">';
      html += '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--ink-soft);">인건비율</div><div style="font-weight:700;font-size:13.5px;margin-top:2px;color:'+ratioColor+';">'+(sum.laborRatio===null?'—':sum.laborRatio.toFixed(1)+'%')+'</div></div>';
      html += '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--ink-soft);">식자재비율</div><div style="font-weight:700;font-size:13.5px;margin-top:2px;color:'+foodColor+';">'+(sum.expenseRatio===null?'—':sum.expenseRatio.toFixed(1)+'%')+'</div></div>';
      html += '<div style="flex:1;min-width:70px;"><div style="font-size:11px;color:var(--ink-soft);">오늘 체크리스트</div><div style="font-weight:700;font-size:13.5px;margin-top:2px;">'+(sum.checklistPct===null?'—':sum.checklistPct+'%')+'</div></div>';
      html += '</div></div>';
    }

    const editedRecs = state.attendance.filter(a=> a.crewId===state.myCrewId && a.timeEdited && !a.staffAckEdit);
    if(editedRecs.length>0){
      html += '<div style="background:#FFF4E5;border:1px solid #FFD9A0;border-radius:12px;padding:12px 14px;margin-bottom:14px;">';
      html += '<div style="font-weight:800;font-size:13px;color:#8A5A00;margin-bottom:6px;">📝 매니저가 근무시간을 수정했어요</div>';
      editedRecs.forEach(a=>{
        html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;">';
        html += '<span style="font-size:12.5px;color:#6B4500;">'+formatDateLabel(a.date)+' · '+(a.checkIn||"?")+'–'+(a.checkOut||"?")+'</span>';
        html += '<button class="crew-code-btn" data-ackedit="'+a.id+'">확인</button>';
        html += '</div>';
      });
      html += '</div>';
    }

    const todayShift = state.shifts.find(s=>s.date===bizToday() && s.crewId===state.myCrewId);
    html += '<div class="s-card">'+labelWithIcon('clock','오늘 예정 근무');
    html += todayShift ? '<p class="s-main">'+todayShift.start+' – '+todayShift.end+'</p>' : '<p class="s-main">예정된 근무가 없어요</p>';
    html += '</div>';

    if(state.homeChecklistItems){
      const all = countAllFrom(state.homeChecklistItems, state.homeChecklistChecks);
      const remaining = all.total - all.done;
      html += '<div class="s-card">';
      html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">';
      html += labelWithIcon('check','지금 할 일');
      html += '<button class="crew-code-btn" id="home-go-checklist-btn">체크하러 가기 ›</button>';
      html += '</div>';
      html += '<p class="s-main">'+(remaining>0 ? (remaining+'개 남음') : '오늘 체크리스트 완료!')+'</p>';
      html += '</div>';
    }

    const coworkers = state.shifts.filter(s=>s.date===bizToday() && s.crewId!==state.myCrewId);
    if(coworkers.length>0){
      html += '<div class="s-card">'+labelWithIcon('people','오늘 함께 일해요')+'<div class="coworkers">';
      coworkers.forEach(s=>{
        const c = state.crew.find(c=>c.id===s.crewId);
        const nm = c ? c.name : "?";
        html += '<div class="cw-chip">'+renderAvatarBadge(c, 42)+'<div class="cw-name">'+nm+'</div><div class="cw-time">'+s.start+'–'+s.end+'</div></div>';
      });
      html += '</div></div>';
    }

    const openAtt = findOpenAttendance(state.myCrewId);
    const todayAtt = openAtt || state.attendance.find(a=>a.date===bizToday() && a.crewId===state.myCrewId);
    html += '<div class="s-card">';
    if(!todayAtt){
      html += labelWithIcon('clock','출퇴근')+'<p class="attend-status">아직 출근 전이에요</p>';
      html += '<button class="clock-btn in" id="clock-in-btn">출근했어요</button>';
    }else if(!todayAtt.checkOut){
      const crossedMidnight = todayAtt.date !== bizToday();
      const statusText = crossedMidnight
        ? (formatDateLabel(todayAtt.date)+' '+todayAtt.checkIn+'부터 근무 중이에요 (영업일이 바뀌었어요)')
        : (todayAtt.checkIn+'부터 근무 중이에요');
      html += labelWithIcon('clock','출퇴근')+'<p class="attend-status">'+statusText+'</p>';
      html += '<button class="clock-btn out" id="clock-out-btn">퇴근할게요</button>';
    }else{
      const h = hoursBetween(todayAtt.checkIn, todayAtt.checkOut);
      html += labelWithIcon('clock','출퇴근')+'<p class="attend-status">오늘 근무 완료 · '+todayAtt.checkIn+' – '+todayAtt.checkOut+' · 총 '+h.toFixed(1)+'시간</p>';
      html += '<p class="crew-code-hint" style="margin-top:6px;">'+(todayAtt.confirmed ? "매니저 근무확인 완료" : "매니저 근무확인 대기 중이에요")+'</p>';
    }
    html += '</div>';

    const payInfo = calcCrewPay(person, state.monthYear, state.monthNum);
    const net = computeNetPay(person, payInfo.pay);
    html += '<div class="month-pill"><p class="mp-label">'+state.monthYear+'년 '+state.monthNum+'월 내 근무 (확인된 근무 기준)</p>';
    html += '<div class="mp-row"><span>근무일수</span><b>'+payInfo.days+'일</b></div>';
    html += '<div class="mp-row"><span>총 근무시간</span><b>'+payInfo.hours.toFixed(1)+'시간</b></div>';
    if(person.probation){
      html += '<div class="mp-row"><span>수습 적용</span><b>급여액 10% 차감됨</b></div>';
    }
    html += '<div class="mp-row"><span>예상 급여</span><b>'+payInfo.pay.toLocaleString()+'원</b></div>';
    if(net.taxRate > 0){
      html += '<div class="mp-row"><span>세금 ('+net.taxLabel+')</span><b>(-)'+net.taxAmount.toLocaleString()+'원</b></div>';
      html += '<div class="mp-row" style="margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.25);font-size:15px;"><span>최종 환산금액</span><b style="color:#fff;font-size:17px;">'+net.netPay.toLocaleString()+'원</b></div>';
    }
    html += '</div>';

    if(person.isManager){
      html += '<div class="staff-nav"><button id="go-salesreport-btn">매출보고 하기</button></div>';
    }
    html += '<button class="switch-link" id="switch-user-btn">다른 사용자로 전환</button>';
    return html;
  }

  function renderPhotoGrid(arr, arrName, deletable){
    if(!arr || arr.length===0) return '<p class="empty-note" style="padding:8px 0;">등록된 사진이 없어요.</p>';
    let html = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">';
    arr.forEach((src, idx)=>{
      html += '<div style="position:relative;">';
      html += '<img src="'+src+'" class="photo-thumb" style="width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;">';
      if(deletable){
        html += '<button data-delphoto="'+arrName+':'+idx+'" style="position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:none;background:var(--brick);color:#fff;font-size:11px;line-height:1;cursor:pointer;">×</button>';
      }
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  function renderSalesReportForm(){
    const d = state.salesDraft;
    const dateStr = state.salesEditDate || bizToday();
    let html = '<button class="staff-back" id="sr-back-btn">‹ 캘린더로</button>';
    html += '<h3 style="margin:0 0 14px;font-size:16px;font-weight:800;">'+(state.salesEditingId?"매출보고 수정 · ":"매출보고 작성 · ")+formatDateLabel(dateStr)+'</h3>';

    html += '<div class="s-card"><p class="s-label">정산표 사진 (먼저 찍으면 아래 숫자가 자동으로 채워져요)</p>';
    html += renderPhotoGrid(d.settlementPhotos, "settlementPhotos", true);
    html += '<input type="file" accept="image/*" multiple id="settlement-photo-input" style="margin-top:10px;font-size:12.5px;">';
    if((d.settlementPhotos||[]).length>0){
      html += '<button type="button" class="crew-code-btn" id="autofill-photo-btn" style="margin-top:10px;width:100%;">✨ 사진으로 자동입력</button>';
    }
    html += '</div>';

    html += '<div class="s-card"><p class="s-label">오늘 근무 확인</p>';
    const dayAtt = state.attendance.filter(a=>a.date===dateStr && a.checkOut).sort((a,b)=> a.checkIn.localeCompare(b.checkIn));
    if(dayAtt.length===0){
      html += '<p class="empty-note" style="padding:8px 0;">이 날 퇴근 처리된 스텝이 없어요.</p>';
    }else{
      dayAtt.forEach(a=>{
        const c = state.crew.find(c=>c.id===a.crewId);

  function renderSalesCalendar(){
    const y=state.monthYear, m=state.monthNum;
    const totalDays = daysInMonth(y,m);
    const leadEmpty = firstWeekdayMon0(y,m);
    let html = '<h3 style="margin:0 0 14px;font-size:16px;font-weight:800;">매출보고 캘린더</h3>';
    html += '<div class="month-nav"><button id="prev-month">‹</button><span class="month-label">'+y+'년 '+m+'월</span><button id="next-month">›</button></div>';
    html += '<div class="cal-grid">';
    DOW_LABELS.forEach(dl=> html += '<div class="cal-dow">'+dl+'</div>');
    for(let i=0;i<leadEmpty;i++) html += '<div class="cal-day empty"></div>';
    for(let d=1; d<=totalDays; d++){
      const dateStr = y+"-"+pad(m)+"-"+pad(d);
      const isToday = dateStr === bizToday();
      const has = state.salesReports.some(r=>r.date===dateStr);
      html += '<div class="cal-day'+(isToday?' today':'')+'" data-salesformdate="'+dateStr+'">';
      html += d + (has ? '<span class="dot dot-done"></span>' : '');
      html += '</div>';
    }
    html += '</div>';
    html += '<p class="crew-code-hint">초록 점이 있는 날은 이미 보고를 제출한 날이에요. 날짜를 누르면 새로 작성하거나 수정할 수 있어요.</p>';
    return html;
  }

  function renderStaffSchedule(){
    const y=state.monthYear, m=state.monthNum;
    const totalDays = daysInMonth(y,m);
    const leadEmpty = firstWeekdayMon0(y,m);
    let html = '<h3 style="margin:0 0 14px;font-size:16px;font-weight:800;">'+state.store+' 스케줄</h3>';
    html += '<div class="month-nav"><button id="prev-month">‹</button><span class="month-label">'+y+'년 '+m+'월</span><button id="next-month">›</button></div>';
    html += '<div class="cal-grid">';
    DOW_LABELS.forEach(dl=> html += '<div class="cal-dow">'+dl+'</div>');
    for(let i=0;i<leadEmpty;i++) html += '<div class="cal-day empty"></div>';
    for(let d=1; d<=totalDays; d++){
      const dateStr = y+"-"+pad(m)+"-"+pad(d);
      const isToday = dateStr === bizToday();
      const isSel = dateStr === state.selectedDate;
      const cnt = shiftsOnDate(dateStr).length;
      html += '<div class="cal-day'+(isToday?' today':'')+(isSel?' selected':'')+'" data-staffscheduledate="'+dateStr+'">';

      html += '</div>';

    if(state.selectedDate){
      html += '<div class="day-panel">';
      html += '<h3>'+formatDateLabel(state.selectedDate)+' 근무</h3>';

      html += '<p class="crew-code-hint">날짜를 누르면 그날 누가 근무하는지 볼 수 있어요.</p>';
    }
    return html;
  }

    if(state.announcements.length===0){
      html += '<div class="empty-note">등록된 공지사항이 없어요.</div>';

      state.announcements.forEach(a=>{
        const confirmed = a.reads && a.reads[state.myCrewId];
        html += '<div class="category" style="padding:16px;margin-bottom:12px;">';
        html += '<div style="font-weight:800;font-size:14.5px;">'+escapeHtml(a.title)+'</div>';
        html += '<div style="font-size:11.5px;color:var(--ink-soft);margin-top:2px;">'+escapeHtml(a.authorName)+' · '+formatDateLabel(new Date(a.createdAt).toISOString().slice(0,10))+'</div>';

          html += '<span class="pos-badge mgr-badge" style="display:inline-block;margin-top:10px;">확인함</span>';
        }else{
          html += '<button class="clock-btn in" data-confirmann="'+a.id+'" style="margin-top:10px;padding:11px;">확인했어요</button>';
        }
        if(person && person.isManager){
          const totalStaff = state.crew.length;
          const readCount = a.reads ? Object.keys(a.reads).length : 0;
          const unread = state.crew.filter(c=> !(a.reads && a.reads[c.id]));
          html += '<p class="crew-code-hint" style="margin-top:10px;">확인 '+readCount+'/'+totalStaff+'명</p>';

    const data = state.dashboardData;
    let totalSales = 0, totalPay = 0, totalExpense = 0, totalDelivery = 0;
    data.forEach(d=>{ totalSales += d.salesSum; totalPay += d.laborPay; totalExpense += (d.expenseSum||0); totalDelivery += (d.deliverySum||0); });

    const missingStores = data.filter(d=> !d.hasYesterdayReport);
